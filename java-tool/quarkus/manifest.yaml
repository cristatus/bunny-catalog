id: quarkus
name: Quarkus CLI
description: Command-line tool for creating and managing Quarkus projects
version: "3.37.3"
category: java-tool
homepage: https://quarkus.io/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/quarkusio/quarkus/releases/download/{version}/quarkus-cli-{version}.zip"
      file: "quarkus-cli-{version}.zip"
      sha256: "ba0fb041bca19ae24f45ab34047ac463c094bb9ea9c4e90d78aa43e2d4796c8f"
      update:
        type: github
        repo: quarkusio/quarkus
        asset: "quarkus-cli-[0-9.]+\\.zip$"
        tag-pattern: "([0-9.]+)"
prepare:
    - "unzip -q quarkus-cli-{version}.zip"
    - "mv quarkus-cli-{version}/* {pkg}/"
bin:
    - {name: quarkus, path: "{app}/bin/quarkus"}
