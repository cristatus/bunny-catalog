id: async-profiler
name: async-profiler
description: Low-overhead sampling profiler for Java using AsyncGetCallTrace and perf_events
version: "4.5"
category: java-tool
kind: sdk
homepage: https://github.com/async-profiler/async-profiler
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/async-profiler/async-profiler/releases/download/v{version}/async-profiler-{version}-linux-x64.tar.gz"
      file: "async-profiler-{version}.tar.gz"
      sha256: "89546fbb9ee0fc5496c7edd4099b0709489bc78b0d8057ccbb4b801f6b032b62"
      size: 447164
      update:
        type: github
        repo: async-profiler/async-profiler
        asset: "^async-profiler-{version}-linux-x64\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf async-profiler-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: asprof, path: "{app}/bin/asprof"}
    - {name: jfrconv, path: "{app}/bin/jfrconv"}
