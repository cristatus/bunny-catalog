id: kotlin
name: Kotlin
description: The Kotlin command-line compiler (kotlinc) and runner
version: "2.4.10"
category: java-tool
kind: sdk
homepage: https://kotlinlang.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/JetBrains/kotlin/releases/download/v{version}/kotlin-compiler-{version}.zip"
      file: "kotlin-compiler-{version}.zip"
      sha256: "473dd66c7a3ef4b182065b3da670466c1bf2773a9dbb0ed8b33a39fe9d4f876d"
      update:
        type: github
        repo: JetBrains/kotlin
        asset: "kotlin-compiler-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q kotlin-compiler-{version}.zip"
    - "mv kotlinc/* {pkg}/"
bin:
    - {name: kotlin, path: "{app}/bin/kotlin"}
    - {name: kotlinc, path: "{app}/bin/kotlinc"}
