id: helidon
name: Helidon CLI
description: Command-line tool for creating and developing Helidon applications
version: "3.0.6"
category: java-tool
homepage: https://helidon.io/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/helidon-io/helidon-build-tools/releases/download/{version}/helidon-cli-linux-amd64"
      file: "helidon-cli-linux-amd64"
      sha256: "d92466a476d6357bd2b517520e98f31f0dce5a99014d262d61b101fd71821d8f"
      update:
        type: github
        repo: helidon-io/helidon-build-tools
        asset: "helidon-cli-linux-amd64$"
        tag-pattern: "([0-9.]+)"
prepare:
    - "mkdir -p {pkg}/bin"
    - "cp helidon-cli-linux-amd64 {pkg}/bin/helidon"
    - "chmod +x {pkg}/bin/helidon"
bin:
    - {name: helidon, path: "{app}/bin/helidon"}
