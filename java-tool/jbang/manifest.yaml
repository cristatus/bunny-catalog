id: jbang
name: JBang
description: Run Java (and JVM) source files as scripts — no build setup
version: "0.139.3"
category: java-tool
homepage: https://www.jbang.dev/
license: MIT
requires: [jdk]
sources:
    - url: "https://github.com/jbangdev/jbang/releases/download/v{version}/jbang-{version}.zip"
      file: "jbang-{version}.zip"
      sha256: "6ff8d2f387583a8b1b1eb7839826a5e0a227c7cf1550e3bd85e0beb4838ca3ef"
      update:
        type: github
        repo: jbangdev/jbang
        asset: "jbang-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q jbang-{version}.zip"
    - "mv jbang-{version}/* {pkg}/"
bin:
    - {name: jbang, path: "{app}/bin/jbang"}
