id: sbt
name: sbt
description: Interactive build tool for Scala and Java projects
version: "2.0.5"
category: java-tool
homepage: https://www.scala-sbt.org/
license: Apache-2.0
requires: ["jdk>=17"]
sources:
    - url: "https://github.com/sbt/sbt/releases/download/v{version}/sbt-{version}.tgz"
      file: "sbt-{version}.tgz"
      sha256: "2a53c95403cb7fccd5da05d48cfe03ff4be573a3f3d0295a41963b109e756a18"
      size: 57658207
      update:
        type: github
        repo: sbt/sbt
        asset: "^sbt-{version}\\.tgz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf sbt-{version}.tgz --strip-components=1 -C {pkg}"
bin:
    - {name: sbt, path: "{app}/bin/sbt"}
    - {name: sbtn, path: "{app}/bin/sbtn-x86_64-pc-linux"}
env:
    SBT_OPTS: "-Dsbt.global.base={data}/sbt -Dsbt.boot.directory={data}/boot -Dsbt.ivy.home={data}/ivy"
    COURSIER_CACHE: "{data}/coursier"
dirs:
    - "{data}/sbt"
    - "{data}/boot"
    - "{data}/ivy"
    - "{data}/coursier"
