id: maven
name: Apache Maven
description: Build automation and project management tool for Java projects
version: "3.9.16"
category: java-tool
homepage: https://maven.apache.org/
license: Apache-2.0
requires: [jdk]
toolchains: maven
sources:
    - url: "https://dlcdn.apache.org/maven/maven-3/{version}/binaries/apache-maven-{version}-bin.tar.gz"
      file: "maven-{version}.tar.gz"
      sha512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
      size: 9278065
      update:
        type: html
        url: "https://dlcdn.apache.org/maven/maven-3/"
        version-pattern: 'href="([0-9.]+)/"'
prepare:
    - "tar xf maven-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: mvn, path: "{app}/bin/mvn"}
env:
    # Point Maven at the toolchains.xml bunny generates from the installed JDKs.
    # The local repository is left alone: it stays at ~/.m2/repository unless
    # the user redirects it in ~/.bunny/config.yaml.
    MAVEN_ARGS: "--toolchains {data}/toolchains.xml"
