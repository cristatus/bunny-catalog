id: arthas
name: Arthas
description: Interactive diagnostics and troubleshooting tool for live Java applications
version: "4.3.2"
category: java-tool
homepage: https://arthas.aliyun.com/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/alibaba/arthas/releases/download/arthas-all-{version}/arthas-bin.zip"
      file: "arthas-{version}.zip"
      sha256: "f35902aebb01efa5d9777a42358c023f022a9d4c3058b0ad477fa8da5b61f0aa"
      size: 17075597
      update:
        type: github
        repo: alibaba/arthas
        asset: "^arthas-bin\\.zip$"
        tag-pattern: "^arthas-all-([0-9.]+)$"
prepare:
    - "unzip -q arthas-{version}.zip -d {pkg}"
    - "chmod +x {pkg}/as.sh"
bin:
    - {name: arthas, path: "{app}/as.sh"}
