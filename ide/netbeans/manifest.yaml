id: netbeans
name: Apache NetBeans
description: Open-source IDE for Java and other languages from the Apache Software Foundation
version: "30"
category: ide
homepage: https://netbeans.apache.org/
license: Apache-2.0
requires: [jdk>=21]

sources:
  - url: "https://dlcdn.apache.org/netbeans/netbeans/{version}/netbeans-{version}-bin.zip"
    file: "netbeans-{version}-bin.zip"
    sha512: "18df3504f8e75e563669b2442e2a3940136e3f7f4892d319c5e11ef03b76a1d52b46b104ff1c6b54f5b46b3c99199b1b75fe09cf1b2dd6ba8b491137a4bba7f7"
    size: 520635086
    update:
      type: github
      repo: apache/netbeans
      asset: "netbeans-[0-9]+-bin\\.zip$"
      tag-pattern: "^([0-9]+)$"
      url-template: "https://dlcdn.apache.org/netbeans/netbeans/{version}/netbeans-{version}-bin.zip"
      hash-url: "https://downloads.apache.org/netbeans/netbeans/{version}/netbeans-{version}-bin.zip.sha512"

prepare:
  - "unzip -q netbeans-{version}-bin.zip -d {pkg}"

bin:
  - name: netbeans
    path: "{app}/netbeans/bin/netbeans"

icons:
  - {src: "{app}/nb/netbeans.png", name: "apache-netbeans", size: "48x48"}

desktop:
  - id: netbeans.desktop
    name: Apache NetBeans
    genericName: Java IDE
    comment: Open-source IDE for Java and other languages
    exec: "netbeans %f"
    icon: apache-netbeans
    type: Application
    categories: [Development, IDE]
    keywords: [apache, netbeans, java, ide]
