id: jetbrains-toolbox
name: JetBrains Toolbox
description: Install, update, and roll back JetBrains IDEs (IntelliJ IDEA, PyCharm, …) from one app
version: "3.6.1.85592"
category: ide
homepage: https://www.jetbrains.com/toolbox-app/
license: LicenseRef-JetBrains-Toolbox-EULA
sources:
    - url: "https://download.jetbrains.com/toolbox/jetbrains-toolbox-{version}.tar.gz"
      file: "jetbrains-toolbox-{version}.tar.gz"
      sha256: "9282664b47b6d14c96e865a0b54738d4252a9c2824c20e99101eaba0575c183d"
      size: 170067365
      update:
        type: json
        url: "https://data.services.jetbrains.com/products/releases?code=TBA&latest=true&type=release"
        version-query: "TBA[0].downloads.linux.link"
        tag-pattern: "jetbrains-toolbox-([0-9.]+)\\.tar\\.gz"
        url-query: "TBA[0].downloads.linux.link"
        hash-url: "https://download.jetbrains.com/toolbox/jetbrains-toolbox-{version}.tar.gz.sha256"
prepare:
    # Toolbox is an AppImage that self-integrates (its own menu entry + hi-res
    # icon) on first launch; bunny just delivers and launches the binary. The
    # bundled tray logo gives the menu entry an icon before that first run.
    - "tar xf jetbrains-toolbox-{version}.tar.gz --strip-components=1 -C {pkg}"
    - "cp {pkg}/bin/toolbox-tray-color.png {pkg}/jetbrains-toolbox.png"
bin:
    - {name: jetbrains-toolbox, path: "{app}/bin/jetbrains-toolbox"}
icons:
    - {src: "{app}/jetbrains-toolbox.png", name: "jetbrains-toolbox", size: "32x32"}
desktop:
    - id: jetbrains-toolbox.desktop
      name: JetBrains Toolbox
      genericName: IDE Manager
      comment: Manage your JetBrains IDEs and projects
      exec: "jetbrains-toolbox"
      icon: jetbrains-toolbox
      type: Application
      startupNotify: false
      startupWMClass: jetbrains-toolbox
      categories: [Development]
      keywords: [jetbrains, toolbox, ide, intellij]
