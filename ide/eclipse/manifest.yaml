id: eclipse
name: Eclipse IDE for Java Developers
description: The essential tools for Java developers — IDE, Git, Maven, Gradle, XML Editor
version: "2026-06"
category: ide
homepage: https://www.eclipse.org/
license: EPL-2.0
requires: [jdk]
sources:
    - url: "https://download.eclipse.org/technology/epp/downloads/release/{version}/R/eclipse-java-{version}-R-linux-gtk-x86_64.tar.gz"
      file: "eclipse-{version}.tar.gz"
      sha512: "7e30aeaf1227068d00deabe45f397a9cb82a251f77c4df760e471f0811b9de4d5b5fcdfbe2ab750f0c9db68d3de763e32ae739ef4dc03617f7892f2accd3f344"
      size: 369976872
      update:
        type: html
        url: "https://download.eclipse.org/technology/epp/downloads/release/release.xml"
        version-pattern: '<present>(\d{4}-\d{2})/R</present>'
        url-template: "https://download.eclipse.org/technology/epp/downloads/release/{version}/R/eclipse-java-{version}-R-linux-gtk-x86_64.tar.gz"
    # google-java-format plugin, pre-installed under dropins/ so users get
    # formatting out of the box. Tracks gjf releases independently of Eclipse
    # via its own update block; the trailing --add-exports lines in
    # eclipse.ini are gjf's runtime requirement on Java 16+.
    - url: "https://github.com/google/google-java-format/releases/download/v1.35.0/google-java-format-eclipse-plugin-1.35.0.jar"
      file: "gjf-eclipse-plugin.jar"
      sha256: "14e9d7c72cf0c638fcf019adc34f0c9d550708f1b8c2390a6407eeae8b0719f8"
      size: 2995354
      update:
        type: github
        repo: google/google-java-format
        asset: "google-java-format-eclipse-plugin-.*\\.jar$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "tar xf eclipse-{version}.tar.gz --strip-components=1 -C {pkg}"
    - "mkdir -p {pkg}/dropins && cp gjf-eclipse-plugin.jar {pkg}/dropins/"
    # Persist Eclipse's runtime config in bunny's per-app data dir, plus the
    # JDK exports google-java-format needs.
    - |
      cat >> {pkg}/eclipse.ini <<EOF

      -Dosgi.configuration.area={data}/configuration
      --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
      EOF
bin:
    - {name: eclipse, path: "{app}/eclipse"}
dirs:
    - "{data}/configuration"
icons:
    - {src: "{app}/icon.xpm", name: "eclipse", size: "256x256"}
desktop:
    - id: eclipse.desktop
      name: Eclipse IDE for Java Developers
      genericName: Java IDE
      comment: IDE for Java developers — Git, Maven, Gradle, XML editor
      exec: "eclipse %f"
      icon: eclipse
      type: Application
      startupWMClass: Eclipse
      categories: [Development, IDE]
      mimeType: [text/x-java, text/x-maven+xml, text/x-gradle, text/x-patch, text/x-diff, x-scheme-handler/eclipse+mpc]
      keywords: [eclipse, java, ide]
