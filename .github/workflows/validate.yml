name: Validate catalog

on:
  pull_request:
    paths:
      - '**/manifest.yaml'
      - 'index.json'
      - '.github/workflows/validate.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install bunny
        run: |
          go install github.com/cristatus/bunny/cmd/bunny@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate catalog via bunny
        run: |
          export BUNNY_HOME="$RUNNER_TEMP/bunny-home"
          mkdir -p "$BUNNY_HOME"
          ln -s "$GITHUB_WORKSPACE" "$BUNNY_HOME/catalog"
          bunny dev validate
