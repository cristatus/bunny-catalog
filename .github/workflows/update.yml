name: Update catalog

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC every day
  workflow_dispatch:       # allow manual triggers from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install bunny
        run: |
          GOPROXY=direct go install github.com/cristatus/bunny/cmd/bunny@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run 'bunny dev update'
        run: |
          export BUNNY_HOME="$RUNNER_TEMP/bunny-home"
          mkdir -p "$BUNNY_HOME"
          ln -s "$GITHUB_WORKSPACE" "$BUNNY_HOME/catalog"
          bunny dev update

      - name: Commit and push updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No catalog updates.'
            exit 0
          fi
          git commit -m 'chore: auto-update catalog manifests'
          git push origin HEAD:main
