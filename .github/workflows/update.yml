name: Update catalog

on:
  schedule:
    - cron: '0 0 * * 1'   # 00:00 UTC every Monday
  workflow_dispatch:        # allow manual triggers from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install bunny
        run: |
          go install github.com/cristatus/bunny/cmd/bunny@main
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run 'bunny dev update'
        id: update
        run: |
          export BUNNY_HOME="$RUNNER_TEMP/bunny-home"
          mkdir -p "$BUNNY_HOME"
          ln -s "$GITHUB_WORKSPACE" "$BUNNY_HOME/catalog"
          bunny dev update 2>&1 | tee /tmp/bunny-update.log
          # Extract bumped packages for the PR body. `bunny dev update` logs
          # one "Rewrote manifest" line per primary-source bump.
          {
            echo 'bumps<<EOF'
            grep -oE 'package=\S+ from=\S+ to=\S+' /tmp/bunny-update.log \
              | sed -E 's/package=([^ ]+) from=([^ ]+) to=([^ ]+)/- `\1`: \2 → \3/' \
              || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v8
        with:
          branch: catalog/auto-update
          commit-message: 'chore: auto-update catalog manifests'
          title: 'chore: auto-update catalog manifests'
          body: |
            Automated catalog refresh from the weekly cron.

            ## Bumps
            ${{ steps.update.outputs.bumps }}

            Generated by `bunny dev update` against the upstream sources
            declared in each manifest's `update:` block. Review the diff
            before merging — version bumps may need a paired manual change
            to `prepare:` if upstream changed archive layout.
          delete-branch: true
