name: Update catalog

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC every day
  workflow_dispatch:       # allow manual triggers from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install bunny
        run: |
          git clone --depth=1 --branch main https://github.com/cristatus/bunny.git "$RUNNER_TEMP/bunny"
          (cd "$RUNNER_TEMP/bunny" && go install ./cmd/bunny)
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run 'bunny dev update'
        run: |
          export BUNNY_HOME="$RUNNER_TEMP/bunny-home"
          mkdir -p "$BUNNY_HOME"
          # 'bunny dev' acts on a checkout listed under catalogs:, and the
          # list is exhaustive, so name this one and nothing else.
          cat > "$BUNNY_HOME/config.yaml" <<YAML
          catalogs:
            - name: bunny
              local: $GITHUB_WORKSPACE
          YAML
          bunny dev update

      # A single package whose upstream check breaks fails the step above; commit
      # regardless so one stale pattern does not discard every other rewrite.
      - name: Commit and push updates
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'No catalog updates.'
            exit 0
          fi
          git commit -m 'chore: auto-update catalog manifests'
          git push origin HEAD:main
