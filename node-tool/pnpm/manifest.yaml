id: pnpm
name: pnpm
description: Fast, disk-efficient package manager for JavaScript projects
version: "11.21.0"
category: node-tool
homepage: https://pnpm.io/
license: MIT
sources:
    - url: "https://github.com/pnpm/pnpm/releases/download/v{version}/pnpm-linux-x64.tar.gz"
      file: "pnpm-{version}.tar.gz"
      sha256: "aadc489ce4473c2af0fec06a5c19e113b5793d404eac49853c8153bf4b0d8263"
      size: 51007454
      update:
        type: github
        repo: pnpm/pnpm
        asset: "^pnpm-linux-x64\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf pnpm-{version}.tar.gz -C {pkg}"
bin:
    - {name: pnpm, path: "{app}/pnpm"}
env:
    PNPM_HOME: "{data}/bin"
    npm_config_store_dir: "{data}/store"
dirs:
    - "{data}/bin"
    - "{data}/store"
global-bins:
    - "{data}/bin"
