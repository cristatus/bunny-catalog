id: jdk-21
name: Eclipse Temurin JDK 21
description: Production-ready OpenJDK 21 LTS distribution from Adoptium
version: "21.0.11+10"
category: sdk
homepage: https://adoptium.net/
license: GPL-2.0-with-classpath-exception

provides: jdk

sources:
  - url: "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.11%2B10/OpenJDK21U-jdk_x64_linux_hotspot_21.0.11_10.tar.gz"
    file: "temurin-jdk-{version}.tar.gz"
    sha256: "4b2220e232a97997b436ca6ab15cbf70171ecff52958a46159dfa5a8c44ca4de"
    size: 207513939
    update:
      type: foojay
      distribution: temurin

prepare:
  - "tar xf temurin-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"

bin:
  - { name: java,     path: "{app}/bin/java" }
  - { name: javac,    path: "{app}/bin/javac" }
  - { name: jar,      path: "{app}/bin/jar" }
  - { name: javadoc,  path: "{app}/bin/javadoc" }
  - { name: jshell,   path: "{app}/bin/jshell" }
  - { name: jlink,    path: "{app}/bin/jlink" }
  - { name: jpackage, path: "{app}/bin/jpackage" }
  - { name: jdeps,    path: "{app}/bin/jdeps" }
  - { name: keytool,  path: "{app}/bin/keytool" }

env:
  JAVA_HOME: "{app}"
