id: graalvm-21
name: GraalVM Community 21
description: GraalVM Community Edition with JDK 21 and native-image
version: "21.0.2"
category: sdk
kind: sdk
homepage: https://www.graalvm.org/
license: GPL-2.0-with-classpath-exception

provides: jdk

sources:
  - url: "https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-21.0.2/graalvm-community-jdk-21.0.2_linux-x64_bin.tar.gz"
    file: "graalvm-community-{version}.tar.gz"
    sha256: "b048069aaa3a99b84f5b957b162cc181a32a4330cbc35402766363c5be76ae48"
    size: 288637296
    update:
      type: foojay
      distribution: graalvm_community

prepare:
  - "tar xf graalvm-community-{version}.tar.gz --strip-components=1 -C {pkg}"

bin:
  - { name: java,         path: "{app}/bin/java" }
  - { name: javac,        path: "{app}/bin/javac" }
  - { name: jar,          path: "{app}/bin/jar" }
  - { name: javadoc,      path: "{app}/bin/javadoc" }
  - { name: jshell,       path: "{app}/bin/jshell" }
  - { name: jlink,        path: "{app}/bin/jlink" }
  - { name: jpackage,     path: "{app}/bin/jpackage" }
  - { name: jdeps,        path: "{app}/bin/jdeps" }
  - { name: keytool,      path: "{app}/bin/keytool" }
  - { name: native-image, path: "{app}/bin/native-image" }

env:
  JAVA_HOME: "{app}"
  GRAALVM_HOME: "{app}"
