id: jdk-25
name: Eclipse Temurin JDK 25
description: Production-ready OpenJDK 25 LTS distribution from Adoptium
version: "25.0.4+7"
category: sdk
kind: sdk
homepage: https://adoptium.net/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4%2B7/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4_7.tar.gz"
      file: "temurin-jdk-{version}.tar.gz"
      sha256: "e58fcdcd637b25c03ca84cbbcefc70d11efb8f4b4cbd05decc9f661769d77f94"
      size: 141328157
      update:
        type: foojay
        distribution: temurin
prepare:
    - "tar xf temurin-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jshell, path: "{app}/bin/jshell"}
    - {name: jlink, path: "{app}/bin/jlink"}
    - {name: jpackage, path: "{app}/bin/jpackage"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
