id: corretto-17
name: Amazon Corretto JDK 17
description: Amazon's no-cost, production-ready distribution of OpenJDK 17 LTS
version: "17.0.19"
category: sdk
homepage: https://aws.amazon.com/corretto/
license: GPL-2.0-with-classpath-exception

provides: jdk

sources:
  - url: "https://corretto.aws/downloads/resources/17.0.19.10.1/amazon-corretto-17.0.19.10.1-linux-x64.tar.gz"
    file: "corretto-jdk-{version}.tar.gz"
    sha256: "d0f1b880445691425511c3aa62cb89889f03a71c2a43597a3df174fc01d3f3a0"
    size: 194517904
    update:
      type: foojay
      distribution: corretto
      hash-url: "https://corretto.aws/downloads/latest_sha256/amazon-corretto-{major}-x64-linux-jdk.tar.gz"

prepare:
  - "tar xf corretto-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"

bin:
  - { name: java, path: "{app}/bin/java" }
  - { name: javac, path: "{app}/bin/javac" }
  - { name: jar, path: "{app}/bin/jar" }
  - { name: javadoc, path: "{app}/bin/javadoc" }
  - { name: jshell, path: "{app}/bin/jshell" }
  - { name: jlink, path: "{app}/bin/jlink" }
  - { name: jpackage, path: "{app}/bin/jpackage" }
  - { name: jdeps, path: "{app}/bin/jdeps" }
  - { name: keytool, path: "{app}/bin/keytool" }

env:
  JAVA_HOME: "{app}"

