id: jbr-21
name: JetBrains Runtime 21
description: JetBrains' OpenJDK 21 fork with per-monitor HiDPI scaling and Swing/AWT rendering fixes
version: "21.0.11+1163116"
category: sdk
homepage: https://github.com/JetBrains/JetBrainsRuntime
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-21.0.11-linux-x64-b1163.116.tar.gz"
      file: "jbrsdk-jcef-{version}.tar.gz"
      sha512: "6085bd3823ae88719e9920a43b3fed299d5e0454eb3b9755746f0f4833d1746a2b92aadb9608bf3df2da4c71fd88e6697e08000136885b6098fd30f42c29def8"
      size: 524965409
      update:
        type: foojay
        distribution: jetbrains
prepare:
    - "tar xf jbrsdk-jcef-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jshell, path: "{app}/bin/jshell"}
    - {name: jlink, path: "{app}/bin/jlink"}
    - {name: jpackage, path: "{app}/bin/jpackage"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
