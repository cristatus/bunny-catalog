id: jdk-8
name: Eclipse Temurin JDK 8
description: Production-ready OpenJDK 8 LTS distribution from Adoptium
version: "8.0.502+7"
category: sdk
kind: sdk
homepage: https://adoptium.net/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u502-b07/OpenJDK8U-jdk_x64_linux_hotspot_8u502b07.tar.gz"
      file: "temurin-jdk-{version}.tar.gz"
      sha256: "b8f5440f64f50193c01f67dacba55c9660caffe13b908baf6bd1955f4dd4c3ea"
      size: 103536381
      update:
        type: foojay
        distribution: temurin
prepare:
    - "tar xf temurin-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
