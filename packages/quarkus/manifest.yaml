id: quarkus
name: Quarkus CLI
description: Command-line tool for creating and managing Quarkus projects
version: "3.40.1"
kind: sdk
tags: [framework, java]
homepage: https://quarkus.io/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/quarkusio/quarkus/releases/download/3.40.1/quarkus-cli-3.40.1.zip"
      file: "quarkus-cli-{version}.zip"
      sha256: "5fa2eb9f9d6fc3392bbb569faf3a097f4df0007922a7f030e55f702aa3f8245b"
      update:
        type: github
        repo: quarkusio/quarkus
        asset: "quarkus-cli-[0-9.]+\\.zip$"
        tag-pattern: "([0-9.]+)"
prepare:
    - "unzip -q quarkus-cli-{version}.zip"
    - "mv quarkus-cli-{version}/* {pkg}/"
bin:
    - {name: quarkus, path: "{app}/bin/quarkus"}
