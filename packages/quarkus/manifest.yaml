id: quarkus
name: Quarkus CLI
description: Command-line tool for creating and managing Quarkus projects
version: "3.40.1.1"
kind: sdk
tags: [framework, java]
homepage: https://quarkus.io/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/quarkusio/quarkus/releases/download/3.40.1.1/quarkus-cli-3.40.1.1.zip"
      file: "quarkus-cli-{version}.zip"
      sha256: "cd1120ea641d7064203c1ee69361e35e870ea4e3a458aea84bfcfabdeffd4747"
      update:
        type: github
        repo: quarkusio/quarkus
        asset: "quarkus-cli-[0-9.]+\\.zip$"
        tag-pattern: "([0-9.]+)"
prepare:
    - "unzip -q quarkus-cli-{version}.zip"
    - "mv quarkus-cli-{version}/* {pkg}/"
bin:
    - {name: quarkus, path: "{app}/bin/quarkus"}
