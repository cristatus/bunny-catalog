id: jmeter
name: Apache JMeter
description: Load testing and performance measurement tool for applications and services
version: "5.6.3"
kind: app
tags: [java, profiler]
homepage: https://jmeter.apache.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-{version}.tgz"
      file: "jmeter-{version}.tar.gz"
      sha512: "5978a1a35edb5a7d428e270564ff49d2b1b257a65e17a759d259a9283fc17093e522fe46f474a043864aea6910683486340706d745fcdf3db1505fd71e689083"
      size: 87414762
      update:
        type: html
        url: "https://dlcdn.apache.org/jmeter/binaries/"
        version-pattern: 'apache-jmeter-([0-9.]+)\.tgz'
    # The binary tarball ships no icon at all. Vendor the project's own square
    # logo from its source repo (Apache-2.0, same as jmeter itself), pinned by
    # sha256 so installs don't depend on the raw URL staying put.
    - url: "https://raw.githubusercontent.com/apache/jmeter/master/xdocs/images/jmeter_square.png"
      file: "jmeter.png"
      sha256: "71dd7828fd367ff67d33baeb2ed01cf1014e9b821216c8734c6e00964297b081"
      size: 7027
prepare:
    - "tar xf jmeter-{version}.tar.gz --strip-components=1 -C {pkg}"
    - "cp jmeter.png {pkg}/jmeter.png"
bin:
    - {name: jmeter, path: "{app}/bin/jmeter"}
icons:
    - {src: "{app}/jmeter.png", name: "jmeter", size: "256x256"}
desktop:
    - id: jmeter.desktop
      name: Apache JMeter
      genericName: Load Testing Tool
      comment: Load testing and performance measurement tool for applications and services
      exec: "jmeter"
      icon: jmeter
      type: Application
      categories: [Development, Profiling, Java]
      keywords: [jmeter, java, load-testing, performance-testing]
