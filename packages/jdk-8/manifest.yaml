id: jdk-8
name: Eclipse Temurin JDK 8
description: Production-ready OpenJDK 8 LTS distribution from Adoptium
version: "8.0.512+9"
kind: sdk
tags: [java, jdk]
homepage: https://adoptium.net/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://github.com/adoptium/temurin8-binaries/releases/download/jdk8u512-b09/OpenJDK8U-jdk_x64_linux_hotspot_8u512b09.tar.gz"
      file: "temurin-jdk-{version}.tar.gz"
      sha256: "fb3bfa869012419b562bb4235d0d83ec4f8c1dda62ae432ba20c6c3a7e43f7e4"
      size: 103570317
      update:
        type: foojay
        distribution: temurin
prepare:
    - "tar xf temurin-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: javap, path: "{app}/bin/javap"}
    - {name: jarsigner, path: "{app}/bin/jarsigner"}
    - {name: jps, path: "{app}/bin/jps"}
    - {name: jstack, path: "{app}/bin/jstack"}
    - {name: jmap, path: "{app}/bin/jmap"}
    - {name: jcmd, path: "{app}/bin/jcmd"}
    - {name: jinfo, path: "{app}/bin/jinfo"}
    - {name: jstat, path: "{app}/bin/jstat"}
    - {name: jfr, path: "{app}/bin/jfr"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
