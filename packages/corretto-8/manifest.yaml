id: corretto-8
name: Amazon Corretto JDK 8
description: Amazon's no-cost, production-ready distribution of OpenJDK 8 LTS
version: "8.0.512"
kind: sdk
tags: [java, jdk]
homepage: https://aws.amazon.com/corretto/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://corretto.aws/downloads/resources/8.512.09.1/amazon-corretto-8.512.09.1-linux-x64.tar.gz"
      file: "corretto-jdk-{version}.tar.gz"
      sha256: "2f2df938886e61c80010ed5af0ea6504ca685280a3b807c5c59ed3ca4fb95be4"
      size: 102641929
      update:
        type: foojay
        distribution: corretto
        hash-url: "https://corretto.aws/downloads/latest_sha256/amazon-corretto-{major}-x64-linux-jdk.tar.gz"
prepare:
    - "tar xf corretto-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: javap, path: "{app}/bin/javap"}
    - {name: jarsigner, path: "{app}/bin/jarsigner"}
    - {name: jps, path: "{app}/bin/jps"}
    - {name: jstack, path: "{app}/bin/jstack"}
    - {name: jmap, path: "{app}/bin/jmap"}
    - {name: jcmd, path: "{app}/bin/jcmd"}
    - {name: jinfo, path: "{app}/bin/jinfo"}
    - {name: jstat, path: "{app}/bin/jstat"}
    - {name: jfr, path: "{app}/bin/jfr"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
