id: liberica-8
name: BellSoft Liberica JDK 8
description: Production-ready OpenJDK 8 LTS distribution from BellSoft
version: "8.0.513+9"
kind: sdk
tags: [java, jdk]
homepage: https://bell-sw.com/libericajdk/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://github.com/bell-sw/Liberica/releases/download/8u513+9/bellsoft-jdk8u513+9-linux-amd64.tar.gz"
      file: "liberica-jdk-{version}.tar.gz"
      sha256: "a9c91a31fc48574af6f6503b8d607ef07f33af418e525c92ecda71763a629c0b"
      size: 106945586
      update:
        type: foojay
        distribution: liberica
prepare:
    - "tar xf liberica-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: javap, path: "{app}/bin/javap"}
    - {name: jarsigner, path: "{app}/bin/jarsigner"}
    - {name: jps, path: "{app}/bin/jps"}
    - {name: jstack, path: "{app}/bin/jstack"}
    - {name: jmap, path: "{app}/bin/jmap"}
    - {name: jcmd, path: "{app}/bin/jcmd"}
    - {name: jinfo, path: "{app}/bin/jinfo"}
    - {name: jstat, path: "{app}/bin/jstat"}
    - {name: jfr, path: "{app}/bin/jfr"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
