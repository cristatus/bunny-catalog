id: pi
name: pi
description: AI agent toolkit with a coding agent CLI, TUI, and unified LLM API
version: "1.5.2"
kind: cli
tags: [ai]
homepage: https://github.com/earendil-works/pi
license: MIT
sources:
    - url: "https://github.com/earendil-works/pi/releases/download/v1.5.2/pi-linux-x64.tar.gz"
      file: "pi-{version}.tar.gz"
      sha256: "811c6f2c9e7aaee252b5404252e556fb713aa209c1f7f924226aa77d4ef70cb5"
      size: 58922566
      update:
        type: github
        repo: earendil-works/pi
        asset: "^pi-linux-x64\\.tar\\.gz$"
prepare:
    # Unlike the other agent CLIs this ships a directory, not a bare binary:
    # the executable sits beside a wasm module and its theme files.
    - "tar xf pi-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: pi, path: "{app}/pi"}
env:
    # bunny owns updates; this only skips pi's own startup version check, not
    # its other network calls (unlike the broader PI_OFFLINE).
    PI_SKIP_VERSION_CHECK: "1"
