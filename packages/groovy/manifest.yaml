id: groovy
name: Apache Groovy
description: Dynamic, optionally-typed language for the JVM with Java-like syntax
version: "6.0.0"
kind: sdk
tags: [groovy, language]
homepage: https://groovy.apache.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://dlcdn.apache.org/groovy/{version}/distribution/apache-groovy-binary-{version}.zip"
      file: "groovy-{version}.zip"
      sha256: "54ab1a877f01da2ed16ed43c1ed7a8d6c36b122714c6959712700e89e6efde7c"
      size: 49076665
      update:
        type: html
        url: "https://dlcdn.apache.org/groovy/"
        version-pattern: 'href="([0-9.]+)/"'
prepare:
    - "unzip -q groovy-{version}.zip"
    - "mv groovy-{version}/* {pkg}/"
bin:
    - {name: groovy, path: "{app}/bin/groovy"}
    - {name: groovyc, path: "{app}/bin/groovyc"}
    - {name: groovysh, path: "{app}/bin/groovysh"}
    - {name: groovydoc, path: "{app}/bin/groovydoc"}
