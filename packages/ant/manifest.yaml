id: ant
name: Apache Ant
description: Java build tool for declarative, task-based build scripts
version: "1.10.18"
kind: sdk
tags: [build-tool, java]
homepage: https://ant.apache.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://dlcdn.apache.org/ant/binaries/apache-ant-{version}-bin.tar.gz"
      file: "ant-{version}.tar.gz"
      sha512: "c510d744876d8da48dabc9495b023b6ec5284a0f18b40ee50d98ce099e791ca5c73e3cd4c80d3c90d3efc03f9620be43aad0a373ed47198284f7e3373e0db2c3"
      size: 7133405
      update:
        type: html
        url: "https://ant.apache.org/bindownload"
        version-pattern: "Apache Ant ([0-9.]+) is the latest released version"
        url-template: "https://dlcdn.apache.org/ant/binaries/apache-ant-{version}-bin.tar.gz"
        hash-url: "https://dlcdn.apache.org/ant/binaries/apache-ant-{version}-bin.tar.gz.sha512"
prepare:
    - "tar xf ant-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: ant, path: "{app}/bin/ant"}
env:
    ANT_HOME: "{app}"
