id: spring-boot
name: Spring Boot CLI
description: Command-line tool for quickly prototyping with Spring Boot
version: "4.1.1"
kind: sdk
tags: [framework, java]
homepage: https://spring.io/projects/spring-boot
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-cli/{version}/spring-boot-cli-{version}-bin.tar.gz"
      file: "spring-boot-cli-{version}.tar.gz"
      sha256: "1b2bf6991e5540728b862f49721241d3d52acb9d48e48ce5ea0d24d75978dfc4"
      size: 7374975
      update:
        type: html
        url: "https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-cli/maven-metadata.xml"
        version-pattern: "<version>([0-9]+(?:\\.[0-9]+){2})</version>"
        hash-url: "https://repo1.maven.org/maven2/org/springframework/boot/spring-boot-cli/{version}/spring-boot-cli-{version}-homebrew.rb"
        hash-pattern: "sha256 '([a-f0-9]{64})'"
prepare:
    - "tar xf spring-boot-cli-{version}.tar.gz"
    - "mv spring-{version}/* {pkg}/"
bin:
    - {name: spring, path: "{app}/bin/spring"}
