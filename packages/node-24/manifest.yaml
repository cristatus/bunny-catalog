id: node-24
name: Node.js 24 LTS
description: JavaScript runtime built on V8 (Active LTS — Krypton)
version: "24.22.1"
kind: sdk
tags: [node, runtime]
homepage: https://nodejs.org/
license: MIT
provides: node
sources:
    - url: "https://nodejs.org/dist/v{version}/node-v{version}-linux-x64.tar.xz"
      file: "node-{version}.tar.xz"
      sha256: "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6"
      size: 32026916
      update:
        type: json
        url: "https://nodejs.org/dist/index.json"
        tag-query: "$[?(@.lts=='Krypton')].version"
        tag-pattern: "v(24\\.[0-9.]+)"
        url-template: "https://nodejs.org/dist/{tag}/node-{tag}-linux-x64.tar.xz"
        hash-url: "https://nodejs.org/dist/{tag}/SHASUMS256.txt"
prepare:
    - "tar xf node-{version}.tar.xz --strip-components=1 -C {pkg}"
bin:
    - {name: node, path: "{app}/bin/node"}
    - {name: npm, path: "{app}/bin/npm"}
    - {name: npx, path: "{app}/bin/npx"}
    - {name: corepack, path: "{app}/bin/corepack"}
global-bins:
    # npm's default prefix is node's own prefix, so `npm -g` installs into the
    # version's install tree. Caches (~/.npm, ~/.cache/node) stay on the host.
    #
    # Also where corepack drops pnpm/yarn shims: run `corepack enable pnpm
    # yarn` (or `corepack use pnpm@<version>`) then `bunny reshim` to expose
    # them. A standalone `bunny install pnpm`/`yarn` package always takes
    # precedence over corepack's if both are present.
    - "{app}/bin"
