id: sbt
name: sbt
description: Interactive build tool for Scala and Java projects
version: "2.0.8"
kind: sdk
tags: [build-tool, scala]
homepage: https://www.scala-sbt.org/
license: Apache-2.0
requires: ["jdk>=17"]
sources:
    - url: "https://github.com/sbt/sbt/releases/download/v{version}/sbt-{version}.tgz"
      file: "sbt-{version}.tgz"
      sha256: "40c2a31786d36a286f0d9e8bfdf51181e5408c4f99eab85556e2bcd5e12eab44"
      size: 57687816
      update:
        type: github
        repo: sbt/sbt
        asset: "^sbt-{version}\\.tgz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf sbt-{version}.tgz --strip-components=1 -C {pkg}"
bin:
    - {name: sbt, path: "{app}/bin/sbt"}
    - {name: sbtn, path: "{app}/bin/sbtn-x86_64-pc-linux"}
