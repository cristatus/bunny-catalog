id: sbt
name: sbt
description: Interactive build tool for Scala and Java projects
version: "2.1.1"
kind: sdk
tags: [build-tool, scala]
homepage: https://www.scala-sbt.org/
license: Apache-2.0
requires: ["jdk>=17"]
sources:
    - url: "https://github.com/sbt/sbt/releases/download/v2.1.1/sbt-2.1.1.tgz"
      file: "sbt-{version}.tgz"
      sha256: "54f99416b027f201d881326075bf85f20680d8c3f2b09415584829e868b34999"
      size: 46169210
      update:
        type: github
        repo: sbt/sbt
        asset: "^sbt-{version}\\.tgz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf sbt-{version}.tgz --strip-components=1 -C {pkg}"
bin:
    - {name: sbt, path: "{app}/bin/sbt"}
    - {name: sbtn, path: "{app}/bin/sbtn-x86_64-pc-linux"}
