id: sbt
name: sbt
description: Interactive build tool for Scala and Java projects
version: "2.0.12"
kind: sdk
tags: [build-tool, scala]
homepage: https://www.scala-sbt.org/
license: Apache-2.0
requires: ["jdk>=17"]
sources:
    - url: "https://github.com/sbt/sbt/releases/download/v2.0.12/sbt-2.0.12.tgz"
      file: "sbt-{version}.tgz"
      sha256: "a797e1d940260c9d6e8a0a434ff8fc3247c1b711d2cf302bae62ae243293fe55"
      size: 56524873
      update:
        type: github
        repo: sbt/sbt
        asset: "^sbt-{version}\\.tgz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf sbt-{version}.tgz --strip-components=1 -C {pkg}"
bin:
    - {name: sbt, path: "{app}/bin/sbt"}
    - {name: sbtn, path: "{app}/bin/sbtn-x86_64-pc-linux"}
