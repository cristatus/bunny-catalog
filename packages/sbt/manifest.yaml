id: sbt
name: sbt
description: Interactive build tool for Scala and Java projects
version: "2.0.11"
kind: sdk
tags: [build-tool, scala]
homepage: https://www.scala-sbt.org/
license: Apache-2.0
requires: ["jdk>=17"]
sources:
    - url: "https://github.com/sbt/sbt/releases/download/v2.0.11/sbt-2.0.11.tgz"
      file: "sbt-{version}.tgz"
      sha256: "d8409a244e97c3839f27c4f435f49421196c126a450d30f4cf53522d39e3c379"
      size: 56497099
      update:
        type: github
        repo: sbt/sbt
        asset: "^sbt-{version}\\.tgz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf sbt-{version}.tgz --strip-components=1 -C {pkg}"
bin:
    - {name: sbt, path: "{app}/bin/sbt"}
    - {name: sbtn, path: "{app}/bin/sbtn-x86_64-pc-linux"}
