id: sbt
name: sbt
description: Interactive build tool for Scala and Java projects
version: "2.1.0"
kind: sdk
tags: [build-tool, scala]
homepage: https://www.scala-sbt.org/
license: Apache-2.0
requires: ["jdk>=17"]
sources:
    - url: "https://github.com/sbt/sbt/releases/download/v2.1.0/sbt-2.1.0.tgz"
      file: "sbt-{version}.tgz"
      sha256: "c26da34433ffa8a503682cc9b7d3789ed84305070b9f187948f0a41b82d76f10"
      size: 57620475
      update:
        type: github
        repo: sbt/sbt
        asset: "^sbt-{version}\\.tgz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf sbt-{version}.tgz --strip-components=1 -C {pkg}"
bin:
    - {name: sbt, path: "{app}/bin/sbt"}
    - {name: sbtn, path: "{app}/bin/sbtn-x86_64-pc-linux"}
