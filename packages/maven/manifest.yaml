id: maven
name: Apache Maven
description: Build automation and project management tool for Java projects
version: "3.10.0"
kind: sdk
tags: [build-tool, java]
homepage: https://maven.apache.org/
license: Apache-2.0
requires: [jdk]
toolchains: maven
sources:
    - url: "https://dlcdn.apache.org/maven/maven-3/{version}/binaries/apache-maven-{version}-bin.tar.gz"
      file: "maven-{version}.tar.gz"
      sha512: "908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa"
      size: 9979885
      update:
        type: html
        url: "https://dlcdn.apache.org/maven/maven-3/"
        version-pattern: 'href="([0-9.]+)/"'
prepare:
    - "tar xf maven-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: mvn, path: "{app}/bin/mvn"}
env:
    # Point Maven at the toolchains.xml bunny generates from the installed JDKs,
    # via the installation slot rather than the user slot. -t/--toolchains is an
    # *alternate path for the user file*, so it replaces ~/.m2/toolchains.xml
    # and hides any toolchain the user declared there. Maven reads the global
    # and user files both, and merges them, so this adds the generated JDKs
    # instead of substituting for hand-written entries.
    # The local repository is left alone: it stays at ~/.m2/repository unless
    # the user redirects it in ~/.bunny/config.yaml.
    MAVEN_ARGS: "--global-toolchains {data}/toolchains.xml"
