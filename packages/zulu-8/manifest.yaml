id: zulu-8
name: Azul Zulu JDK 8
description: Azul's free, TCK-tested build of OpenJDK 8 LTS
version: "8.0.502+7"
kind: sdk
tags: [java, jdk]
homepage: https://www.azul.com/downloads/?package=jdk
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://cdn.azul.com/zulu/bin/zulu8.96.0.19-ca-jdk8.0.502-linux_x64.tar.gz"
      file: "zulu-jdk-{version}.tar.gz"
      sha256: "5923daaf12fd0b87e60e437aaae7b2e5b257846cdb8ac15065258fb59a1da70a"
      size: 106703823
      update:
        type: foojay
        distribution: zulu
prepare:
    - "tar xf zulu-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
