id: zulu-8
name: Azul Zulu JDK 8
description: Azul's free, TCK-tested build of OpenJDK 8 LTS
version: "8.0.512+8"
kind: sdk
tags: [java, jdk]
homepage: https://www.azul.com/downloads/?package=jdk
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://cdn.azul.com/zulu/bin/zulu8.98.0.107-ca-jdk8.0.512-linux_x64.tar.gz"
      file: "zulu-jdk-{version}.tar.gz"
      sha256: "f82a4cb00bbac1ddaa4e578cd6221361a45ee0e4ce51969c4109451750e5164e"
      size: 106727157
      update:
        type: foojay
        distribution: zulu
prepare:
    - "tar xf zulu-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: javap, path: "{app}/bin/javap"}
    - {name: jarsigner, path: "{app}/bin/jarsigner"}
    - {name: jps, path: "{app}/bin/jps"}
    - {name: jstack, path: "{app}/bin/jstack"}
    - {name: jmap, path: "{app}/bin/jmap"}
    - {name: jcmd, path: "{app}/bin/jcmd"}
    - {name: jinfo, path: "{app}/bin/jinfo"}
    - {name: jstat, path: "{app}/bin/jstat"}
    - {name: jfr, path: "{app}/bin/jfr"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
