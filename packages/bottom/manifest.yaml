id: bottom
name: bottom
description: Cross-platform graphical process/system monitor, a top/htop alternative
version: "0.14.9"
kind: cli
tags: [cli]
homepage: https://github.com/ClementTsang/bottom
license: MIT
sources:
    - url: "https://github.com/ClementTsang/bottom/releases/download/{version}/bottom_x86_64-unknown-linux-musl.tar.gz"
      sha256: "b4bee5b193e7d3f6e090ac14f0ca15acec2e7fe4ef64988e0bfc492e16c28c9a"
      size: 2126967
      update:
        type: github
        repo: ClementTsang/bottom
        asset: "^bottom_x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf bottom_x86_64-unknown-linux-musl.tar.gz -C {pkg}"
bin:
    - {name: btm, path: "{app}/btm"}
completions:
    bash: "{app}/completion/btm.bash"
    zsh: "{app}/completion/_btm"
    fish: "{app}/completion/btm.fish"
