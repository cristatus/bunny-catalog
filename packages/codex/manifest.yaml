id: codex
name: Codex CLI
description: OpenAI's coding agent for the terminal
version: "0.151.0"
kind: cli
tags: [ai]
homepage: https://developers.openai.com/codex/cli
license: Apache-2.0
sources:
    # The package archive, not the bare codex-<target> tarball: codex reads
    # codex-package.json to locate its siblings, and without them code mode
    # refuses to start ("install `codex-code-mode-host`"), the sandbox has no
    # bwrap, and shell tools have no bundled rg or zsh.
    #
    # Tags in this repo are prefixed (rust-v0.147.0) because the repo also
    # releases other components, so tag-pattern recovers the bare version.
    - url: "https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-x86_64-unknown-linux-musl.tar.gz"
      file: "codex-{version}.tar.gz"
      sha256: "6e35ac60b86c0e8c7f8bcf797be8b92206199f6253200b66ff0547276f8cfa5c"
      size: 131450621
      update:
        type: github
        repo: openai/codex
        asset: "^codex-package-x86_64-unknown-linux-musl\\.tar\\.gz$"
        tag-pattern: "^rust-v(.+)$"
        hash-url: "https://github.com/openai/codex/releases/download/rust-v{version}/codex-package_SHA256SUMS"
prepare:
    - "tar xf codex-{version}.tar.gz -C {pkg}"
    - "mkdir -p {pkg}/shell-completions/bash {pkg}/shell-completions/zsh {pkg}/shell-completions/fish"
    - "{pkg}/bin/codex completion bash > {pkg}/shell-completions/bash/codex"
    - "{pkg}/bin/codex completion zsh > {pkg}/shell-completions/zsh/_codex"
    - "{pkg}/bin/codex completion fish > {pkg}/shell-completions/fish/codex.fish"
bin:
    - {name: codex, path: "{app}/bin/codex"}
completions:
    bash: "{app}/shell-completions/bash/codex"
    zsh: "{app}/shell-completions/zsh/_codex"
    fish: "{app}/shell-completions/fish/codex.fish"
