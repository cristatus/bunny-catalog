id: codex
name: Codex CLI
description: OpenAI's coding agent for the terminal
version: "0.147.0"
kind: cli
tags: [ai]
homepage: https://developers.openai.com/codex/cli
license: Apache-2.0

sources:
    # Tags in this repo are prefixed (rust-v0.147.0) because the repo also
    # releases other components, so tag-pattern recovers the bare version.
    - url: "https://github.com/openai/codex/releases/download/rust-v{version}/codex-x86_64-unknown-linux-musl.tar.gz"
      file: "codex-{version}.tar.gz"
      sha256: "0246e2e773834e07f0fb5249ed6ebad12e4591e608f8c7bb97dd6a9690544c36"
      size: 98970270
      update:
        type: github
        repo: openai/codex
        asset: "^codex-x86_64-unknown-linux-musl\\.tar\\.gz$"
        tag-pattern: "^rust-v(.+)$"

prepare:
    - "tar xf codex-{version}.tar.gz -C {pkg}"
    - "mv {pkg}/codex-x86_64-unknown-linux-musl {pkg}/codex"
    - "mkdir -p {pkg}/shell-completions/bash {pkg}/shell-completions/zsh"
    - "{pkg}/codex completion bash > {pkg}/shell-completions/bash/codex"
    - "{pkg}/codex completion zsh > {pkg}/shell-completions/zsh/_codex"

bin:
    - {name: codex, path: "{app}/codex"}

completions:
    bash: "{app}/shell-completions/bash/codex"
    zsh: "{app}/shell-completions/zsh/_codex"
