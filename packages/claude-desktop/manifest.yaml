id: claude-desktop
name: Claude Desktop
description: Anthropic's desktop app for Claude, with Claude Code sessions built in
version: "1.40609.0"
kind: app
tags: [ai]
homepage: https://claude.ai/download
license: LicenseRef-Anthropic-Consumer-Terms
sources:
    # Anthropic publishes only an apt repo, no portable tarball, so take the
    # .deb from the pool and unpack it on any distro (the Cursor approach).
    # Pool files are versioned and immutable, so the pin stays valid.
    - url: "https://downloads.claude.ai/claude-desktop/apt/stable/pool/main/c/claude-desktop/claude-desktop_{version}_amd64.deb"
      file: "claude-desktop-{version}.deb"
      sha256: "a96e96ff8eb4d4d7ffa785aba7fc23f8684b12ac83ed2ef4060f0f09f4177a98"
      size: 166561632
      update:
        type: debian
        root: https://downloads.claude.ai/claude-desktop/apt/stable
        dist: stable
        component: main
        package-name: claude-desktop
prepare:
    - "ar x claude-desktop-{version}.deb"
    - "tar xf data.tar.xz"
    # Self-contained Electron bundle: move it wholesale so the binary keeps its
    # sibling resources (chrome-sandbox, *.pak, locales, libs).
    - "mv usr/lib/claude-desktop/* {pkg}/"
    - "cp usr/share/icons/hicolor/256x256/apps/claude-desktop.png {pkg}/claude-desktop.png"
bin:
    - {name: claude-desktop, path: "{app}/claude-desktop"}
icons:
    - {src: "{app}/claude-desktop.png", name: "claude-desktop", size: "256x256"}
desktop:
    - id: claude-desktop.desktop
      name: Claude
      genericName: AI Assistant
      comment: Desktop application for Claude.ai
      exec: "claude-desktop %U"
      icon: claude-desktop
      type: Application
      startupNotify: true
      # The Wayland app_id / X11 WM_CLASS Chromium derives from the app's
      # desktopName, so docks group windows under this entry.
      startupWMClass: com.anthropic.Claude
      categories: [Utility, Development]
      keywords: [AI, Chat, Assistant, Claude, Code, LLM]
      mimeType: [x-scheme-handler/claude]
      actions:
        - {id: new-chat, name: "New chat", exec: "claude-desktop claude://claude.ai/new"}
        - {id: new-code, name: "New Claude Code session", exec: "claude-desktop claude://code/new"}
