id: claude
name: Claude Code
description: Anthropic's coding agent for the terminal
version: "2.1.241"
kind: cli
tags: [ai]
homepage: https://github.com/anthropics/claude-code
license: LicenseRef-Anthropic-Commercial-Terms
sources:
    # The glibc build, which is what upstream's own installer picks on a
    # mainstream distro; a -musl variant sits beside it for systems without
    # glibc.
    - url: "https://github.com/anthropics/claude-code/releases/download/v{version}/claude-linux-x64.tar.gz"
      file: "claude-{version}.tar.gz"
      sha256: "c171011648d71b96a0956469a46315a4c826ccba7e20854ae62aa5c776d6a794"
      size: 103342709
      update:
        type: github
        repo: anthropics/claude-code
        asset: "^claude-linux-x64\\.tar\\.gz$"
prepare:
    - "tar xf claude-{version}.tar.gz -C {pkg}"
bin:
    - {name: claude, path: "{app}/claude"}
