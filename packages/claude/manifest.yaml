id: claude
name: Claude Code
description: Anthropic's coding agent for the terminal
version: "2.1.258"
kind: cli
tags: [ai]
homepage: https://github.com/anthropics/claude-code
license: LicenseRef-Anthropic-Commercial-Terms
sources:
    # The glibc build, which is what upstream's own installer picks on a
    # mainstream distro; a -musl variant sits beside it for systems without
    # glibc.
    - url: "https://github.com/anthropics/claude-code/releases/download/v{version}/claude-linux-x64.tar.gz"
      file: "claude-{version}.tar.gz"
      sha256: "4dcbd239217dd01a5cf73002eea8f85e945170830d66891948426a09c99f3292"
      size: 95382580
      update:
        type: github
        repo: anthropics/claude-code
        asset: "^claude-linux-x64\\.tar\\.gz$"
prepare:
    - "tar xf claude-{version}.tar.gz -C {pkg}"
bin:
    - {name: claude, path: "{app}/claude"}
env:
    # bunny owns updates and this install's location; DISABLE_UPDATES is the
    # stricter of the two update flags, blocking `claude update`/`claude
    # install` too, not just the background check. DISABLE_INSTALLATION_CHECKS
    # silences warnings that assume the native installer's own layout, which
    # this manually-managed install doesn't follow.
    DISABLE_UPDATES: "1"
    DISABLE_INSTALLATION_CHECKS: "1"
