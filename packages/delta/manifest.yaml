id: delta
name: delta
description: Syntax-highlighting pager for git, diff, and grep output
version: "0.20.0"
kind: cli
tags: [cli]
homepage: https://github.com/dandavison/delta
license: MIT
sources:
    - url: "https://github.com/dandavison/delta/releases/download/0.20.0/delta-0.20.0-x86_64-unknown-linux-musl.tar.gz"
      file: "delta-{version}.tar.gz"
      sha256: "6566c4ca33558f0b63ead06febdc4e50ed05fba3becd70d35329c5120fb698d3"
      size: 3403607
      update:
        type: github
        repo: dandavison/delta
        asset: "delta-.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
        tag-pattern: "([0-9.]+)"
prepare:
    - "tar xf delta-{version}.tar.gz --strip-components=1 -C {pkg}"
    # delta ships no completion files; generate them from the binary itself.
    - "mkdir -p {pkg}/completions"
    - "{pkg}/delta --generate-completion bash > {pkg}/completions/delta.bash"
    - "{pkg}/delta --generate-completion zsh  > {pkg}/completions/_delta"
    - "{pkg}/delta --generate-completion fish > {pkg}/completions/delta.fish"
bin:
    - {name: delta, path: "{app}/delta"}
completions:
    bash: "{app}/completions/delta.bash"
    zsh: "{app}/completions/_delta"
    fish: "{app}/completions/delta.fish"
