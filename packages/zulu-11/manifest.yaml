id: zulu-11
name: Azul Zulu JDK 11
description: Azul's free, TCK-tested build of OpenJDK 11 LTS
version: "11.0.32.1+1"
kind: sdk
tags: [java, jdk]
homepage: https://www.azul.com/downloads/?package=jdk
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://cdn.azul.com/zulu/bin/zulu11.90.205-ca-jdk11.0.32.1-linux_x64.tar.gz"
      file: "zulu-jdk-{version}.tar.gz"
      sha256: "cb9ca98d2bf067b4cdbd616c21dba1f2c77174ea716d1378fb7fdcb6927223d5"
      size: 199519116
      update:
        type: foojay
        distribution: zulu
prepare:
    - "tar xf zulu-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jshell, path: "{app}/bin/jshell"}
    - {name: jlink, path: "{app}/bin/jlink"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
