id: semeru-21
name: IBM Semeru Runtime Open Edition 21
description: OpenJDK 21 LTS distribution from IBM with the Eclipse OpenJ9 JVM
version: "21.0.13"
kind: sdk
tags: [java, jdk]
homepage: https://developer.ibm.com/languages/java/semeru-runtimes/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://github.com/ibmruntimes/semeru21-binaries/releases/download/jdk-21.0.13.0/ibm-semeru-open-jdk_x64_linux_21.0.13.0.tar.gz"
      file: "semeru-jdk-{version}.tar.gz"
      sha256: "0c92b61ea02efe73a7b6d346f1d8324efd50fe1fb848bf3a031a577dc1181d45"
      size: 240668702
      update:
        type: github
        repo: ibmruntimes/semeru21-binaries
        asset: '^ibm-semeru-open-jdk_x64_linux_.*\.tar\.gz$'
        tag-pattern: '^jdk-([0-9]+\.[0-9]+\.[0-9]+)\.0$'
prepare:
    - "tar xf semeru-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jshell, path: "{app}/bin/jshell"}
    - {name: jlink, path: "{app}/bin/jlink"}
    - {name: jpackage, path: "{app}/bin/jpackage"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: javap, path: "{app}/bin/javap"}
    - {name: jarsigner, path: "{app}/bin/jarsigner"}
    - {name: jps, path: "{app}/bin/jps"}
    - {name: jstack, path: "{app}/bin/jstack"}
    - {name: jmap, path: "{app}/bin/jmap"}
    - {name: jcmd, path: "{app}/bin/jcmd"}
    - {name: jinfo, path: "{app}/bin/jinfo"}
    - {name: jstat, path: "{app}/bin/jstat"}
    - {name: jfr, path: "{app}/bin/jfr"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
