id: antigravity-cli
name: Antigravity CLI
description: Google's Antigravity coding agent for the terminal
version: "1.1.14"
kind: cli
tags: [ai]
homepage: https://antigravity.google
license: LicenseRef-Google-Antigravity-Terms
sources:
    # The download path carries an opaque build id after the version, so it
    # cannot be templated from {version}. The json checker reads the version,
    # the whole URL, and a sha512 out of the same manifest upstream's install
    # script verifies against, and rewrites this url on each bump.
    - url: "https://storage.googleapis.com/antigravity-public/antigravity-cli/1.1.14-6392696810635264/linux-x64/cli_linux_x64.tar.gz"
      file: "antigravity-cli-{version}.tar.gz"
      sha512: "481f590b102ca6847ef13b865f08d457048a1f3f01851ed2a3818eb09a53264b107ca5e442a8677248d9790fd96eccf4918a2aed82d866b23d294422ba42f67e"
      size: 55783694
      update:
        type: json
        url: "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json"
        version-query: version
        url-query: url
        hash-query: sha512
prepare:
    # The archive holds one file, named antigravity; upstream's installer
    # renames it to agy on the way in.
    - "tar xf antigravity-cli-{version}.tar.gz -C {pkg}"
    - "mv {pkg}/antigravity {pkg}/agy"
bin:
    - {name: agy, path: "{app}/agy"}
