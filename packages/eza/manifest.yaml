id: eza
name: eza
description: A modern, maintained replacement for ls
version: "0.23.5"
kind: cli
tags: [cli]
homepage: https://github.com/eza-community/eza
license: MIT
sources:
    - url: "https://github.com/eza-community/eza/releases/download/v{version}/eza_x86_64-unknown-linux-musl.tar.gz"
      file: "eza-{version}.tar.gz"
      sha256: "e06eebab74b73d6b7d51a796a353824b001bea82df077706382e100815d28904"
      size: 1412332
      update:
        type: github
        repo: eza-community/eza
        asset: "eza_x86_64-unknown-linux-musl\\.tar\\.gz$"
        tag-pattern: "v([0-9.]+)"
    - url: "https://github.com/eza-community/eza/releases/download/v{version}/completions-{version}.tar.gz"
      file: "eza-completions-{version}.tar.gz"
      sha256: "8ca5a250d28c3c7ebd0077aca203701a17d1ea7c92621d9e274b93965e3c9291"
      size: 7566
      update:
        type: github
        repo: eza-community/eza
        asset: "completions-.*\\.tar\\.gz$"
        tag-pattern: "v([0-9.]+)"
    - url: "https://github.com/eza-community/eza/releases/download/v{version}/man-{version}.tar.gz"
      file: "eza-man-{version}.tar.gz"
      sha256: "cbdae2ad79ae0ef1fd6a06f4644c90cef79a56353bc3bb7cf4663bb2831420f9"
      size: 10548
      update:
        type: github
        repo: eza-community/eza
        asset: "^man-.*\\.tar\\.gz$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "tar xf eza-{version}.tar.gz -C {pkg}"
    - "mkdir -p {pkg}/completions"
    - "tar xf eza-completions-{version}.tar.gz --strip-components=3 -C {pkg}/completions"
    - "mkdir -p {pkg}/man"
    - "tar xf eza-man-{version}.tar.gz --strip-components=3 -C {pkg}/man"
bin:
    - {name: eza, path: "{app}/eza"}
completions:
    bash: "{app}/completions/eza"
    zsh: "{app}/completions/_eza"
    fish: "{app}/completions/eza.fish"
man:
    - "{app}/man"
