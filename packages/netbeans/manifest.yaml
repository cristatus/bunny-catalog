id: netbeans
name: Apache NetBeans
description: Open-source IDE for Java and other languages from the Apache Software Foundation
version: "31"
kind: app
tags: [ide]
homepage: https://netbeans.apache.org/
license: Apache-2.0
requires: [jdk>=21]
sources:
    - url: "https://dlcdn.apache.org/netbeans/netbeans/{version}/netbeans-{version}-bin.zip"
      file: "netbeans-{version}-bin.zip"
      sha512: "108edccc78075b0bc87e3e055170fd03c17442cd1748b68297b49ebe003f8fa5cc7cb265c2fbbe2d5c802d0b29fe5654b89a78a8fd92b784147a7a982f1a42df"
      size: 521032868
      update:
        type: github
        repo: apache/netbeans
        asset: "netbeans-[0-9]+-bin\\.zip$"
        tag-pattern: "^([0-9]+)$"
        url-template: "https://dlcdn.apache.org/netbeans/netbeans/{version}/netbeans-{version}-bin.zip"
        hash-url: "https://downloads.apache.org/netbeans/netbeans/{version}/netbeans-{version}-bin.zip.sha512"
prepare:
    - "unzip -q netbeans-{version}-bin.zip -d {pkg}"
bin:
    # bunny owns updates. plugin.manager.check.interval is a real, current
    # system property (org.netbeans.modules.autoupdate.ui.Utilities,
    # confirmed against apache/netbeans main) that seeds the periodic
    # plugin-update-check schedule; "NEVER" only takes effect while no
    # preference has been saved yet, so a later in-app change still wins.
    - name: netbeans
      path: "{app}/netbeans/bin/netbeans"
      args: ["-J-Dplugin.manager.check.interval=NEVER"]
icons:
    - {src: "{app}/nb/netbeans.png", name: "apache-netbeans", size: "48x48"}
desktop:
    - id: netbeans.desktop
      name: Apache NetBeans
      genericName: Java IDE
      comment: Open-source IDE for Java and other languages
      exec: "netbeans %f"
      icon: apache-netbeans
      type: Application
      categories: [Development, IDE]
      keywords: [apache, netbeans, java, ide]
