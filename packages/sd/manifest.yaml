id: sd
name: sd
description: Intuitive find & replace, a sed alternative
version: "1.1.0"
kind: cli
tags: [cli]
homepage: https://github.com/chmln/sd
license: MIT
sources:
    - url: "https://github.com/chmln/sd/releases/download/v{version}/sd-v{version}-x86_64-unknown-linux-musl.tar.gz"
      sha256: "02f00f4777d43e8e95b7b8d49e1a0d6e502fed4b8e79c1c8b8063857a30caa2e"
      size: 1049511
      update:
        type: github
        repo: chmln/sd
        asset: "sd-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf sd-v{version}-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: sd, path: "{app}/sd"}
completions:
    bash: "{app}/completions/sd.bash"
    zsh: "{app}/completions/_sd"
    fish: "{app}/completions/sd.fish"
