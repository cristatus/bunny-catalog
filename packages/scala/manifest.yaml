id: scala
name: Scala 3
description: Scala 3 compiler, runner, and documentation generator
version: "3.10.0"
kind: sdk
tags: [language, scala]
homepage: https://www.scala-lang.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/scala/scala3/releases/download/3.10.0/scala3-3.10.0.tar.gz"
      file: "scala-{version}.tar.gz"
      sha256: "1ff07ebf32e52d608dda2bd7de875383cff9662da41d3c5952d119283f763314"
      size: 176640330
      update:
        type: github
        repo: scala/scala3
        asset: "^scala3-{version}\\.tar\\.gz$"
        tag-pattern: "^([0-9.]+)$"
prepare:
    - "tar xf scala-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: scala, path: "{app}/bin/scala"}
    - {name: scalac, path: "{app}/bin/scalac"}
    - {name: scaladoc, path: "{app}/bin/scaladoc"}
