id: scala
name: Scala 3
description: Scala 3 compiler, runner, and documentation generator
version: "3.10.1"
kind: sdk
tags: [language, scala]
homepage: https://www.scala-lang.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/scala/scala3/releases/download/3.10.1/scala3-3.10.1.tar.gz"
      file: "scala-{version}.tar.gz"
      sha256: "02bffb7cb800138fc78f54a42fa802feac50918d2202f58d4cd781abf6e953c9"
      size: 178888418
      update:
        type: github
        repo: scala/scala3
        asset: "^scala3-{version}\\.tar\\.gz$"
        tag-pattern: "^([0-9.]+)$"
prepare:
    - "tar xf scala-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: scala, path: "{app}/bin/scala"}
    - {name: scalac, path: "{app}/bin/scalac"}
    - {name: scaladoc, path: "{app}/bin/scaladoc"}
