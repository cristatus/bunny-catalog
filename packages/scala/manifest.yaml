id: scala
name: Scala 3
description: Scala 3 compiler, runner, and documentation generator
version: "3.3.8"
kind: sdk
tags: [language, scala]
homepage: https://www.scala-lang.org/
license: Apache-2.0

requires: [jdk]

sources:
  - url: "https://github.com/scala/scala3/releases/download/{version}/scala3-{version}.tar.gz"
    file: "scala-{version}.tar.gz"
    sha256: "17a03dd9c2a790b4230a7d03b741cdedca6514096e50e7189bc5e2d299db250a"
    size: 37204992
    update:
      type: github
      repo: scala/scala3
      asset: "^scala3-{version}\\.tar\\.gz$"
      tag-pattern: "^([0-9.]+)$"

prepare:
  - "tar xf scala-{version}.tar.gz --strip-components=1 -C {pkg}"

bin:
  - { name: scala, path: "{app}/bin/scala" }
  - { name: scalac, path: "{app}/bin/scalac" }
  - { name: scaladoc, path: "{app}/bin/scaladoc" }
