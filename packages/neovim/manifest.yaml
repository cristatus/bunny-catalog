id: neovim
name: Neovim
description: Hyperextensible Vim-based text editor
version: "0.12.6"
kind: app
tags: [editor]
homepage: https://neovim.io/
license: Apache-2.0
sources:
    - url: "https://github.com/neovim/neovim/releases/download/v0.12.6/nvim-linux-x86_64.tar.gz"
      file: "nvim-{version}.tar.gz"
      sha256: "474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87"
      size: 11404582
      update:
        type: github
        repo: neovim/neovim
        asset: "nvim-linux-x86_64\\.tar\\.gz$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "tar xf nvim-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: nvim, path: "{app}/bin/nvim"}
man:
    - "{app}/share/man/man1/nvim.1"
icons:
    - {src: "{app}/share/icons/hicolor/128x128/apps/nvim.png", name: "nvim", size: "128x128"}
desktop:
    - id: nvim.desktop
      name: Neovim
      genericName: Text Editor
      comment: Edit text files
      exec: "nvim %F"
      icon: nvim
      type: Application
      terminal: true
      categories: [Utility, TextEditor, Development]
      mimeType: [text/plain, text/x-c, text/x-c++, text/x-chdr, text/x-c++hdr, text/x-csrc, text/x-c++src, text/x-java, text/x-tex, application/x-shellscript]
      keywords: [nvim, vim, editor]
