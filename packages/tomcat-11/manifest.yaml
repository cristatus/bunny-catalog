id: tomcat-11
name: Apache Tomcat 11
description: Servlet container implementing the Jakarta EE 11 web specifications
version: "11.0.29"
kind: sdk
tags: [java, server]
homepage: https://tomcat.apache.org/
license: Apache-2.0
provides: tomcat
requires: ["jdk>=17"]
sources:
    - url: "https://dlcdn.apache.org/tomcat/tomcat-11/v{version}/bin/apache-tomcat-{version}.tar.gz"
      file: "tomcat-{version}.tar.gz"
      sha512: "be277ce58876a584653f980fd695c82e6708029f05fc7ad9fcfbdcede3836ae6ffa4f858eac26de6ff938f130f31158be8a54b5f546393ea1ad5da0cd202873c"
      size: 14798110
      update:
        type: html
        url: "https://dlcdn.apache.org/tomcat/tomcat-11/"
        version-pattern: 'href="v(11\.[0-9.]+)/"'
        url-template: "https://dlcdn.apache.org/tomcat/tomcat-11/v{version}/bin/apache-tomcat-{version}.tar.gz"
        hash-url: "https://dlcdn.apache.org/tomcat/tomcat-11/v{version}/bin/apache-tomcat-{version}.tar.gz.sha512"
prepare:
    - "tar xf tomcat-{version}.tar.gz --strip-components=1 -C {pkg}"
    # Tomcat writes to CATALINA_BASE, so the instance lives in {data} and the
    # install tree stays the read-only half an upgrade may replace. A base
    # needs a conf/ of its own, seeded here; the seed fills in what is missing,
    # so an edited server.xml or tomcat-users.xml carries across an upgrade.
    - "mkdir -p {data}/conf && cp -R {pkg}/conf/. {data}/conf/"
bin:
    - {name: catalina, path: "{app}/bin/catalina.sh"}
env:
    CATALINA_HOME: "{app}"
    CATALINA_BASE: "{data}"
dirs:
    # The rest of the instance. webapps starts empty: drop a WAR in, or copy
    # one of the bundled apps out of {app}/webapps (manager included).
    - "{data}/logs"
    - "{data}/temp"
    - "{data}/webapps"
    - "{data}/work"
