id: cursor
name: Cursor
description: The AI Code Editor (VS Code fork by Anysphere)
version: "3.18.9-1787797867"
kind: app
tags: [editor]
homepage: https://cursor.com/
license: LicenseRef-Cursor-EULA
sources:
    - url: "https://downloads.cursor.com/aptrepo/pool/stable/c/cu/cursor_3.18.9_amd64.deb"
      file: "cursor-{version}.deb"
      sha256: "ad4a8a16d81500f7359bd9fce1488962cd88f310c1b8c4e6efec9d3118f05126"
      size: 194150416
      update:
        type: debian
        root: https://downloads.cursor.com/aptrepo
        dist: stable
        component: main
        package-name: cursor
prepare:
    - "ar x cursor-{version}.deb"
    - "tar xf data.tar.xz"
    - "mv usr/share/cursor/* {pkg}/"
    - "cp usr/share/pixmaps/co.anysphere.cursor.png {pkg}/cursor.png"
    - "mkdir -p {pkg}/shell-completions/bash {pkg}/shell-completions/zsh"
    - "cp usr/share/bash-completion/completions/cursor {pkg}/shell-completions/bash/"
    - "cp usr/share/zsh/vendor-completions/_cursor {pkg}/shell-completions/zsh/"
bin:
    - name: cursor
      path: "{app}/cursor"
icons:
    - {src: "{app}/cursor.png", name: "cursor", size: "128x128"}
desktop:
    - id: cursor.desktop
      name: Cursor
      genericName: Text Editor
      comment: The AI Code Editor
      exec: "cursor %F"
      icon: cursor
      type: Application
      startupWMClass: Cursor
      categories: [TextEditor, Development, IDE]
      mimeType: [application/x-cursor-workspace]
      keywords: [cursor, ai, code, editor]
      actions:
        - {id: new-empty-window, name: "New Empty Window", exec: "cursor --new-window"}
    - id: cursor-url-handler.desktop
      name: Cursor - URL Handler
      genericName: Text Editor
      comment: The AI Code Editor
      exec: "cursor --open-url %U"
      icon: cursor
      type: Application
      noDisplay: true
      startupNotify: true
      categories: [Utility, TextEditor, Development, IDE]
      mimeType: [x-scheme-handler/cursor]
      keywords: [cursor]
completions:
    bash: "{app}/shell-completions/bash/cursor"
    zsh: "{app}/shell-completions/zsh/_cursor"
