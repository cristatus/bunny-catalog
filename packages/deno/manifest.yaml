id: deno
name: Deno
description: Secure runtime for JavaScript and TypeScript with built-in tooling
version: "2.9.6"
kind: sdk
tags: [deno, runtime]
homepage: https://deno.com/
license: MIT
sources:
    - url: "https://github.com/denoland/deno/releases/download/v{version}/deno-x86_64-unknown-linux-gnu.zip"
      file: "deno-{version}.zip"
      sha256: "394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2"
      size: 41582794
      update:
        type: github
        repo: denoland/deno
        asset: "deno-x86_64-unknown-linux-gnu\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q deno-{version}.zip -d {pkg}"
bin:
    - {name: deno, path: "{app}/deno"}
