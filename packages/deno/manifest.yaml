id: deno
name: Deno
description: Secure runtime for JavaScript and TypeScript with built-in tooling
version: "2.9.7"
kind: sdk
tags: [deno, runtime]
homepage: https://deno.com/
license: MIT
sources:
    - url: "https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip"
      file: "deno-{version}.zip"
      sha256: "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490"
      size: 41596794
      update:
        type: github
        repo: denoland/deno
        asset: "deno-x86_64-unknown-linux-gnu\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q deno-{version}.zip -d {pkg}"
bin:
    - {name: deno, path: "{app}/deno"}
env:
    # bunny owns updates; this only silences deno's own periodic "new release
    # available" notice. deno never self-updates without `deno upgrade`.
    DENO_NO_UPDATE_CHECK: "1"
