id: hyperfine
name: hyperfine
description: A command-line benchmarking tool
version: "1.21.0"
kind: cli
tags: [cli]
homepage: https://github.com/sharkdp/hyperfine
license: Apache-2.0 OR MIT
sources:
    - url: "https://github.com/sharkdp/hyperfine/releases/download/v1.21.0/hyperfine-v1.21.0-x86_64-unknown-linux-musl.tar.gz"
      sha256: "2c64127c1a0fc3bc58e365060b4d8a09e4632082e4dea843b8e4afb6a7b09f36"
      size: 705869
      update:
        type: github
        repo: sharkdp/hyperfine
        asset: "hyperfine-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf hyperfine-v{version}-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: hyperfine, path: "{app}/hyperfine"}
completions:
    bash: "{app}/autocomplete/hyperfine.bash"
    zsh: "{app}/autocomplete/_hyperfine"
    fish: "{app}/autocomplete/hyperfine.fish"
man:
    - "{app}/hyperfine.1"
