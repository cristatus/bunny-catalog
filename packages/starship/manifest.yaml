id: starship
name: starship
description: Minimal, fast, customizable prompt for any shell
version: "1.27.0"
kind: cli
tags: [cli]
homepage: https://starship.rs/
license: ISC
sources:
    - url: "https://github.com/starship/starship/releases/download/v1.27.0/starship-x86_64-unknown-linux-musl.tar.gz"
      sha256: "10c8eb4cb3b761d9bf59ea828444c2dab36c900b7d69a69e08814b286969df89"
      size: 5215016
      update:
        type: github
        repo: starship/starship
        asset: "^starship-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf starship-x86_64-unknown-linux-musl.tar.gz -C {pkg}"
    # starship ships no completion files; generate them from the binary itself.
    - "mkdir -p {pkg}/completions"
    - "{pkg}/starship completions bash > {pkg}/completions/starship.bash"
    - "{pkg}/starship completions zsh  > {pkg}/completions/_starship"
    - "{pkg}/starship completions fish > {pkg}/completions/starship.fish"
bin:
    - {name: starship, path: "{app}/starship"}
completions:
    bash: "{app}/completions/starship.bash"
    zsh: "{app}/completions/_starship"
    fish: "{app}/completions/starship.fish"
