id: fd
name: fd
description: Simple, fast, user-friendly alternative to find
version: "10.5.2"
kind: cli
tags: [cli]
homepage: https://github.com/sharkdp/fd
license: Apache-2.0 OR MIT
sources:
    - url: "https://github.com/sharkdp/fd/releases/download/v10.5.2/fd-v10.5.2-x86_64-unknown-linux-musl.tar.gz"
      sha256: "7e2d07fa2b8807642aaec67b7e2972a9fbe4db26fcb340a7372392db42b26694"
      size: 1798931
      update:
        type: github
        repo: sharkdp/fd
        asset: "fd-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf fd-v{version}-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: fd, path: "{app}/fd"}
completions:
    bash: "{app}/autocomplete/fd.bash"
    zsh: "{app}/autocomplete/_fd"
    fish: "{app}/autocomplete/fd.fish"
man:
    - "{app}/fd.1"
