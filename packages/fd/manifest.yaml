id: fd
name: fd
description: Simple, fast, user-friendly alternative to find
version: "10.5.0"
kind: cli
tags: [cli]
homepage: https://github.com/sharkdp/fd
license: Apache-2.0 OR MIT
sources:
    - url: "https://github.com/sharkdp/fd/releases/download/v{version}/fd-v{version}-x86_64-unknown-linux-musl.tar.gz"
      sha256: "761c72dc8e120d85b22292063be8a796e2eeb20eb3e4f38b8fa2343ccf3514a7"
      size: 1573549
      update:
        type: github
        repo: sharkdp/fd
        asset: "fd-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf fd-v{version}-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: fd, path: "{app}/fd"}
completions:
    bash: "{app}/autocomplete/fd.bash"
    zsh: "{app}/autocomplete/_fd"
    fish: "{app}/autocomplete/fd.fish"
