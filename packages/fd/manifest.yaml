id: fd
name: fd
description: Simple, fast, user-friendly alternative to find
version: "10.5.1"
kind: cli
tags: [cli]
homepage: https://github.com/sharkdp/fd
license: Apache-2.0 OR MIT
sources:
    - url: "https://github.com/sharkdp/fd/releases/download/v10.5.1/fd-v10.5.1-x86_64-unknown-linux-musl.tar.gz"
      sha256: "f6c95edb190c241df6fddc815a5bab4051444993ac5d92ddc6eec0e0dc2342c7"
      size: 1799129
      update:
        type: github
        repo: sharkdp/fd
        asset: "fd-v.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf fd-v{version}-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: fd, path: "{app}/fd"}
completions:
    bash: "{app}/autocomplete/fd.bash"
    zsh: "{app}/autocomplete/_fd"
    fish: "{app}/autocomplete/fd.fish"
man:
    - "{app}/fd.1"
