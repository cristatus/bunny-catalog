id: kotlin
name: Kotlin
description: The Kotlin command-line compiler (kotlinc) and runner
version: "2.4.20"
kind: sdk
tags: [kotlin, language]
homepage: https://kotlinlang.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/JetBrains/kotlin/releases/download/v2.4.20/kotlin-compiler-2.4.20.zip"
      file: "kotlin-compiler-{version}.zip"
      sha256: "59e9ca74c7904ef2c122b12114937673ccce68de820a663f0ed66ccf8799e0b7"
      update:
        type: github
        repo: JetBrains/kotlin
        asset: "kotlin-compiler-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q kotlin-compiler-{version}.zip"
    - "mv kotlinc/* {pkg}/"
bin:
    - {name: kotlin, path: "{app}/bin/kotlin"}
    - {name: kotlinc, path: "{app}/bin/kotlinc"}
