id: kotlin
name: Kotlin
description: The Kotlin command-line compiler (kotlinc) and runner
version: "2.4.21"
kind: sdk
tags: [kotlin, language]
homepage: https://kotlinlang.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip"
      file: "kotlin-compiler-{version}.zip"
      sha256: "7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd"
      update:
        type: github
        repo: JetBrains/kotlin
        asset: "kotlin-compiler-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q kotlin-compiler-{version}.zip"
    - "mv kotlinc/* {pkg}/"
bin:
    - {name: kotlin, path: "{app}/bin/kotlin"}
    - {name: kotlinc, path: "{app}/bin/kotlinc"}
