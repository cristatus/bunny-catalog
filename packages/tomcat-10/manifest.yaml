id: tomcat-10
name: Apache Tomcat 10.1
description: Servlet container implementing the Jakarta EE 10 web specifications
version: "10.1.61"
kind: sdk
tags: [java, server]
homepage: https://tomcat.apache.org/
license: Apache-2.0
provides: tomcat
requires: ["jdk>=11"]
sources:
    - url: "https://dlcdn.apache.org/tomcat/tomcat-10/v{version}/bin/apache-tomcat-{version}.tar.gz"
      file: "tomcat-{version}.tar.gz"
      sha512: "35120a2b1182bac3d55438fbec0dc581d03b0f1c16ce692a930f3bb6a1097cf896b94b389152257071a87cb2928ac8c15f1bad08387c14acc7c17dbc1bb598fb"
      size: 14488199
      update:
        type: html
        url: "https://dlcdn.apache.org/tomcat/tomcat-10/"
        version-pattern: 'href="v(10\.[0-9.]+)/"'
        url-template: "https://dlcdn.apache.org/tomcat/tomcat-10/v{version}/bin/apache-tomcat-{version}.tar.gz"
        hash-url: "https://dlcdn.apache.org/tomcat/tomcat-10/v{version}/bin/apache-tomcat-{version}.tar.gz.sha512"
prepare:
    - "tar xf tomcat-{version}.tar.gz --strip-components=1 -C {pkg}"
    # Tomcat writes to CATALINA_BASE, so the instance lives in {data} and the
    # install tree stays the read-only half an upgrade may replace. A base
    # needs a conf/ of its own, seeded here; the seed fills in what is missing,
    # so an edited server.xml or tomcat-users.xml carries across an upgrade.
    - "mkdir -p {data}/conf && cp -R {pkg}/conf/. {data}/conf/"
bin:
    - {name: catalina, path: "{app}/bin/catalina.sh"}
env:
    CATALINA_HOME: "{app}"
    CATALINA_BASE: "{data}"
dirs:
    # The rest of the instance. webapps starts empty: drop a WAR in, or copy
    # one of the bundled apps out of {app}/webapps (manager included).
    - "{data}/logs"
    - "{data}/temp"
    - "{data}/webapps"
    - "{data}/work"
