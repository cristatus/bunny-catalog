id: atuin
name: atuin
description: Magical shell history — sync, search, and stats across machines
version: "18.22.0"
kind: cli
tags: [cli]
homepage: https://atuin.sh/
license: MIT
sources:
    - url: "https://github.com/atuinsh/atuin/releases/download/v{version}/atuin-x86_64-unknown-linux-musl.tar.gz"
      sha256: "b3c123df1887cf27c6480a87d148c86831cd83da478e0a8ab773ca188f3f3222"
      size: 16256991
      update:
        type: github
        repo: atuinsh/atuin
        asset: "^atuin-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf atuin-x86_64-unknown-linux-musl.tar.gz --strip-components=1 -C {pkg}"
    # atuin ships no completion files; generate them from the binary itself.
    - "mkdir -p {pkg}/completions"
    - "{pkg}/atuin gen-completions --shell bash > {pkg}/completions/atuin.bash"
    - "{pkg}/atuin gen-completions --shell zsh  > {pkg}/completions/_atuin"
    - "{pkg}/atuin gen-completions --shell fish > {pkg}/completions/atuin.fish"
bin:
    - {name: atuin, path: "{app}/atuin"}
completions:
    bash: "{app}/completions/atuin.bash"
    zsh: "{app}/completions/_atuin"
    fish: "{app}/completions/atuin.fish"
