id: just
name: just
description: A handy command runner, a simpler alternative to make
version: "1.59.0"
kind: cli
tags: [cli]
homepage: https://just.systems/
license: CC0-1.0
sources:
    - url: "https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz"
      sha256: "409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e"
      size: 2572537
      update:
        type: github
        repo: casey/just
        asset: "just-.*-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf just-{version}-x86_64-unknown-linux-musl.tar.gz -C {pkg}"
bin:
    - {name: just, path: "{app}/just"}
completions:
    bash: "{app}/completions/just.bash"
    zsh: "{app}/completions/just.zsh"
    fish: "{app}/completions/just.fish"
man:
    - "{app}/just.1"
