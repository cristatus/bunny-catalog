id: bun
name: Bun
description: Fast all-in-one JavaScript runtime, bundler, test runner, and package manager
version: "1.4.3"
kind: sdk
tags: [bun, runtime]
homepage: https://bun.sh/
license: MIT
sources:
    - url: "https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-x64.zip"
      file: "bun-{version}.zip"
      sha256: "3e730528d89775f03f87f05c06787c4df4099d0a37f3f252e7b829cb23816e18"
      size: 42015139
      update:
        type: github
        repo: oven-sh/bun
        asset: "bun-linux-x64\\.zip$"
        tag-pattern: "bun-v([0-9.]+)"
prepare:
    - "unzip -q bun-{version}.zip"
    - "mv bun-linux-x64/bun {pkg}/bun"
    - "ln -s bun {pkg}/bunx"
bin:
    - {name: bun, path: "{app}/bun"}
    - {name: bunx, path: "{app}/bunx"}
