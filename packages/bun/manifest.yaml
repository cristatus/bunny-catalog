id: bun
name: Bun
description: Fast all-in-one JavaScript runtime, bundler, test runner, and package manager
version: "1.4.0"
kind: sdk
tags: [bun, runtime]
homepage: https://bun.sh/
license: MIT
sources:
    - url: "https://github.com/oven-sh/bun/releases/download/bun-v{version}/bun-linux-x64.zip"
      file: "bun-{version}.zip"
      sha256: "2d03fb5fb83ac8b567aca0a281b2ce1a1a19d488f56c2968d88c3f25e92fe452"
      size: 36697619
      update:
        type: github
        repo: oven-sh/bun
        asset: "bun-linux-x64\\.zip$"
        tag-pattern: "bun-v([0-9.]+)"
prepare:
    - "unzip -q bun-{version}.zip"
    - "mv bun-linux-x64/bun {pkg}/bun"
    - "ln -s bun {pkg}/bunx"
bin:
    - {name: bun, path: "{app}/bun"}
    - {name: bunx, path: "{app}/bunx"}
