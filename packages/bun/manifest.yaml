id: bun
name: Bun
description: Fast all-in-one JavaScript runtime, bundler, test runner, and package manager
version: "1.4.4"
kind: sdk
tags: [bun, runtime]
homepage: https://bun.sh/
license: MIT
sources:
    - url: "https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64.zip"
      file: "bun-{version}.zip"
      sha256: "bf8ccbfb2b0b80159e0f9a6d15c55317add8077534dbc6130a3edb52fccb395c"
      size: 51794595
      update:
        type: github
        repo: oven-sh/bun
        asset: "bun-linux-x64\\.zip$"
        tag-pattern: "bun-v([0-9.]+)"
prepare:
    - "unzip -q bun-{version}.zip"
    - "mv bun-linux-x64/bun {pkg}/bun"
    - "ln -s bun {pkg}/bunx"
bin:
    - {name: bun, path: "{app}/bun"}
    - {name: bunx, path: "{app}/bunx"}
