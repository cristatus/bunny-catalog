id: bun
name: Bun
description: Fast all-in-one JavaScript runtime, bundler, test runner, and package manager
version: "1.4.2"
kind: sdk
tags: [bun, runtime]
homepage: https://bun.sh/
license: MIT
sources:
    - url: "https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip"
      file: "bun-{version}.zip"
      sha256: "36368faef7527875d5ffa52e53cd48021741f2a83eb6208a8dd64068d422a913"
      size: 36646985
      update:
        type: github
        repo: oven-sh/bun
        asset: "bun-linux-x64\\.zip$"
        tag-pattern: "bun-v([0-9.]+)"
prepare:
    - "unzip -q bun-{version}.zip"
    - "mv bun-linux-x64/bun {pkg}/bun"
    - "ln -s bun {pkg}/bunx"
bin:
    - {name: bun, path: "{app}/bun"}
    - {name: bunx, path: "{app}/bunx"}
