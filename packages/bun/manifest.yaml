id: bun
name: Bun
description: Fast all-in-one JavaScript runtime, bundler, test runner, and package manager
version: "1.4.5"
kind: sdk
tags: [bun, runtime]
homepage: https://bun.sh/
license: MIT
sources:
    - url: "https://github.com/oven-sh/bun/releases/download/bun-v1.4.5/bun-linux-x64.zip"
      file: "bun-{version}.zip"
      sha256: "94559b3b528995a49452f9f2404cec74f2efd7d06e0a000a8cd214b02c3666eb"
      size: 51336055
      update:
        type: github
        repo: oven-sh/bun
        asset: "bun-linux-x64\\.zip$"
        tag-pattern: "bun-v([0-9.]+)"
prepare:
    - "unzip -q bun-{version}.zip"
    - "mv bun-linux-x64/bun {pkg}/bun"
    - "ln -s bun {pkg}/bunx"
bin:
    - {name: bun, path: "{app}/bun"}
    - {name: bunx, path: "{app}/bunx"}
