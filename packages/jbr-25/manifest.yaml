id: jbr-25
name: JetBrains Runtime 25
description: JetBrains' OpenJDK 25 fork with per-monitor HiDPI scaling and Swing/AWT rendering fixes
version: "25.0.4.1+62369"
kind: sdk
tags: [java, jdk]
homepage: https://github.com/JetBrains/JetBrainsRuntime
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk_jcef-25.0.4.1-linux-x64-b623.69.tar.gz"
      file: "jbrsdk-jcef-{version}.tar.gz"
      sha512: "611b586274a7e691cd7e974d65eda6e253f32091b4e5d1f55458ac3913a4a27b5ef6283864ccad25eb22eb818711866c493730e036be648a39af835044b38c33"
      size: 562202549
      update:
        type: foojay
        distribution: jetbrains
prepare:
    - "tar xf jbrsdk-jcef-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jshell, path: "{app}/bin/jshell"}
    - {name: jlink, path: "{app}/bin/jlink"}
    - {name: jpackage, path: "{app}/bin/jpackage"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
