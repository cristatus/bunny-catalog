id: opencode
name: opencode
description: Open-source coding agent for the terminal, with a provider-agnostic model backend
version: "2.2.7"
kind: cli
tags: [ai]
homepage: https://opencode.ai
license: MIT
sources:
    # v2 ships through npm only; GitHub releases carry the 1.x line.
    - url: "https://registry.npmjs.org/@opencode/cli-linux-x64/-/cli-linux-x64-2.2.7.tgz"
      file: "opencode-{version}.tgz"
      sha512: "c24fc33c7c6be266a25be166429f33b685e5a3fbc2e6ab261081ec2cd68d2d92f689a2187e1caa1517ba091b02571cbe89bd2c7cad3b5f621ea45c3b6522aa35"
      size: 121204979
      update:
        type: json
        url: "https://registry.npmjs.org/@opencode/cli-linux-x64/latest"
        version-query: "version"
        url-query: "dist.tarball"
        hash-url: "https://registry.npmjs.org/@opencode/cli-linux-x64/{version}"
        hash-pattern: '"integrity":"sha512-([A-Za-z0-9+/=]+)"'
prepare:
    - "tar xf opencode-{version}.tgz -C {pkg} --strip-components=2 package/bin/opencode"
bin:
    - {name: opencode, path: "{app}/opencode"}
env:
    # bunny owns updates; opencode otherwise checks for and installs them
    # itself.
    OPENCODE_DISABLE_AUTOUPDATE: "true"
