id: opencode
name: opencode
description: Open-source coding agent for the terminal, with a provider-agnostic model backend
version: "1.18.32"
kind: cli
tags: [ai]
homepage: https://opencode.ai
license: MIT
sources:
    - url: "https://github.com/anomalyco/opencode/releases/download/v1.18.32/opencode-linux-x64.tar.gz"
      file: "opencode-{version}.tar.gz"
      sha256: "3046e0404fdc60fb80307e7a47824ba07477364178a4d09baa8548496dd6d43b"
      size: 60608353
      update:
        type: github
        repo: anomalyco/opencode
        asset: "^opencode-linux-x64\\.tar\\.gz$"
prepare:
    - "tar xf opencode-{version}.tar.gz -C {pkg}"
    # opencode's completion generator only emits a zsh script (no bash/fish).
    - "mkdir -p {pkg}/completions"
    - "{pkg}/opencode completion > {pkg}/completions/_opencode"
bin:
    - {name: opencode, path: "{app}/opencode"}
completions:
    zsh: "{app}/completions/_opencode"
env:
    # bunny owns updates; opencode otherwise downloads and applies updates on
    # startup. The equivalent opencode.json "autoupdate": false key is
    # currently ignored (anomalyco/opencode#3412), so this is the reliable
    # path.
    OPENCODE_DISABLE_AUTOUPDATE: "true"
