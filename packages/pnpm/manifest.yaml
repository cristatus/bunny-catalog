id: pnpm
name: pnpm
description: Fast, disk-efficient package manager for JavaScript projects
version: "12.21.0"
kind: sdk
tags: [node, package-manager]
homepage: https://pnpm.io/
license: MIT
sources:
    - url: "https://github.com/pnpm/pnpm/releases/download/v12.21.0/pnpm-linux-x64.tar.gz"
      file: "pnpm-{version}.tar.gz"
      sha256: "84c4773bcf4a217f4083cd7b2a91e4cee6103cf42426c1282ef37d308f55a410"
      size: 28885042
      update:
        type: github
        repo: pnpm/pnpm
        asset: "^pnpm-linux-x64\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf pnpm-{version}.tar.gz -C {pkg}"
bin:
    - {name: pnpm, path: "{app}/pnpm"}
