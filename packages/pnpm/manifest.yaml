id: pnpm
name: pnpm
description: Fast, disk-efficient package manager for JavaScript projects
version: "12.18.0"
kind: sdk
tags: [node, package-manager]
homepage: https://pnpm.io/
license: MIT
sources:
    - url: "https://github.com/pnpm/pnpm/releases/download/v12.18.0/pnpm-linux-x64.tar.gz"
      file: "pnpm-{version}.tar.gz"
      sha256: "3726060e236c0db3e7124c0a5af123c840ba0cb76682149b63ea0baf290017c2"
      size: 26976720
      update:
        type: github
        repo: pnpm/pnpm
        asset: "^pnpm-linux-x64\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf pnpm-{version}.tar.gz -C {pkg}"
bin:
    - {name: pnpm, path: "{app}/pnpm"}
