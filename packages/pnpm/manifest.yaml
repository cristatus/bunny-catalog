id: pnpm
name: pnpm
description: Fast, disk-efficient package manager for JavaScript projects
version: "12.6.0"
kind: sdk
tags: [node, package-manager]
homepage: https://pnpm.io/
license: MIT
sources:
    - url: "https://github.com/pnpm/pnpm/releases/download/v12.6.0/pnpm-linux-x64.tar.gz"
      file: "pnpm-{version}.tar.gz"
      sha256: "3f4c66f668d0e84219679982d095b30da68325e1fac9284e7f5dc1584bd3d13e"
      size: 25018674
      update:
        type: github
        repo: pnpm/pnpm
        asset: "^pnpm-linux-x64\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf pnpm-{version}.tar.gz -C {pkg}"
bin:
    - {name: pnpm, path: "{app}/pnpm"}
