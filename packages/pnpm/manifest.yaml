id: pnpm
name: pnpm
description: Fast, disk-efficient package manager for JavaScript projects
version: "12.10.1"
kind: sdk
tags: [node, package-manager]
homepage: https://pnpm.io/
license: MIT
sources:
    - url: "https://github.com/pnpm/pnpm/releases/download/v12.10.1/pnpm-linux-x64.tar.gz"
      file: "pnpm-{version}.tar.gz"
      sha256: "502a275984a4cd01e5579ac72049a241091cac5118e44becf84951130c3e079e"
      size: 23793537
      update:
        type: github
        repo: pnpm/pnpm
        asset: "^pnpm-linux-x64\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf pnpm-{version}.tar.gz -C {pkg}"
bin:
    - {name: pnpm, path: "{app}/pnpm"}
