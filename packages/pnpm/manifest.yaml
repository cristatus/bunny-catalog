id: pnpm
name: pnpm
description: Fast, disk-efficient package manager for JavaScript projects
version: "12.9.1"
kind: sdk
tags: [node, package-manager]
homepage: https://pnpm.io/
license: MIT
sources:
    - url: "https://github.com/pnpm/pnpm/releases/download/v12.9.1/pnpm-linux-x64.tar.gz"
      file: "pnpm-{version}.tar.gz"
      sha256: "b4f58449ac02d9d24023ac89e17e05e8331f8ddc12ca1f489cf231bc2bb2bce1"
      size: 23719389
      update:
        type: github
        repo: pnpm/pnpm
        asset: "^pnpm-linux-x64\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "tar xf pnpm-{version}.tar.gz -C {pkg}"
bin:
    - {name: pnpm, path: "{app}/pnpm"}
