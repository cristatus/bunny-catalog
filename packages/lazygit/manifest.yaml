id: lazygit
name: lazygit
description: A simple terminal UI for git commands
version: "0.66.2"
kind: cli
tags: [cli]
homepage: https://github.com/jesseduffield/lazygit
license: MIT
sources:
    - url: "https://github.com/jesseduffield/lazygit/releases/download/v0.66.2/lazygit_0.66.2_linux_x86_64.tar.gz"
      file: "lazygit-{version}.tar.gz"
      sha256: "158efc9ddfa1241fab5fb3526bb442c8dc6c4b1904d73213b9e4e93e03c52034"
      size: 7332397
      update:
        type: github
        repo: jesseduffield/lazygit
        asset: "lazygit_.*_linux_x86_64\\.tar\\.gz$"
        hash-url: "https://github.com/jesseduffield/lazygit/releases/download/v{version}/checksums.txt"
prepare:
    - "tar xf lazygit-{version}.tar.gz -C {pkg} lazygit"
    # lazygit ships no completion files; generate them from the binary itself.
    - "mkdir -p {pkg}/completions"
    - "{pkg}/lazygit completion bash > {pkg}/completions/lazygit.bash"
    - "{pkg}/lazygit completion zsh  > {pkg}/completions/_lazygit"
    - "{pkg}/lazygit completion fish > {pkg}/completions/lazygit.fish"
bin:
    - {name: lazygit, path: "{app}/lazygit"}
completions:
    bash: "{app}/completions/lazygit.bash"
    zsh: "{app}/completions/_lazygit"
    fish: "{app}/completions/lazygit.fish"
