id: graalvm-25
name: GraalVM Community 25
description: GraalVM Community Edition with JDK 25 and native-image
version: "25.4.4.1"
kind: sdk
tags: [java, jdk]
homepage: https://www.graalvm.org/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.4.4.1.1/graalvm-community-jdk-25i4-25.0.4.1.1_linux-x64_bin.tar.gz"
      file: "graalvm-community-{version}.tar.gz"
      sha256: "05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2"
      size: 349158971
      update:
        type: foojay
        distribution: graalvm_community
prepare:
    - "tar xf graalvm-community-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jshell, path: "{app}/bin/jshell"}
    - {name: jlink, path: "{app}/bin/jlink"}
    - {name: jpackage, path: "{app}/bin/jpackage"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: javap, path: "{app}/bin/javap"}
    - {name: jarsigner, path: "{app}/bin/jarsigner"}
    - {name: jps, path: "{app}/bin/jps"}
    - {name: jstack, path: "{app}/bin/jstack"}
    - {name: jmap, path: "{app}/bin/jmap"}
    - {name: jcmd, path: "{app}/bin/jcmd"}
    - {name: jinfo, path: "{app}/bin/jinfo"}
    - {name: jstat, path: "{app}/bin/jstat"}
    - {name: jfr, path: "{app}/bin/jfr"}
    - {name: keytool, path: "{app}/bin/keytool"}
    - {name: native-image, path: "{app}/bin/native-image"}
    - {name: native-image-configure, path: "{app}/bin/native-image-configure"}
    - {name: native-image-utils, path: "{app}/bin/native-image-utils"}
env:
    JAVA_HOME: "{app}"
    GRAALVM_HOME: "{app}"
