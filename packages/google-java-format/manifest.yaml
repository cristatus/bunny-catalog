id: google-java-format
name: google-java-format
description: Reformats Java source code to the Google Java Style
version: "2.0.0"
kind: cli
tags: [java, cli]
homepage: https://github.com/google/google-java-format
license: Apache-2.0
sources:
    - url: "https://github.com/google/google-java-format/releases/download/v2.0.0/google-java-format_linux-x86-64"
      file: "google-java-format-{version}"
      sha256: "c351f587e6dd1f11836be7296894ea2ab3bd91847dbd14101f4f04d390380fe9"
      size: 33687816
      update:
        type: github
        repo: google/google-java-format
        asset: "^google-java-format_linux-x86-64$"
prepare:
    - "mv google-java-format-{version} {pkg}/google-java-format"
    - "chmod +x {pkg}/google-java-format"
bin:
    - {name: google-java-format, path: "{app}/google-java-format"}
