id: procs
name: procs
description: A modern replacement for ps
version: "0.14.12"
kind: cli
tags: [cli]
homepage: https://github.com/dalance/procs
license: MIT
sources:
    - url: "https://github.com/dalance/procs/releases/download/v0.14.12/procs-v0.14.12-x86_64-linux.zip"
      sha256: "81964faf9d5cd0e9f399d5d0954fb6fe4d4d9f7d3cbec4507633df5a45b11713"
      size: 2565746
      update:
        type: github
        repo: dalance/procs
        asset: "procs-v.*-x86_64-linux\\.zip$"
prepare:
    - "unzip -q procs-v{version}-x86_64-linux.zip -d {pkg}"
    - "chmod +x {pkg}/procs"
    # procs ships no completion files; generate them from the binary itself.
    - "mkdir -p {pkg}/completions"
    - "{pkg}/procs --gen-completion-out bash > {pkg}/completions/procs.bash"
    - "{pkg}/procs --gen-completion-out zsh  > {pkg}/completions/_procs"
    - "{pkg}/procs --gen-completion-out fish > {pkg}/completions/procs.fish"
bin:
    - {name: procs, path: "{app}/procs"}
completions:
    bash: "{app}/completions/procs.bash"
    zsh: "{app}/completions/_procs"
    fish: "{app}/completions/procs.fish"
