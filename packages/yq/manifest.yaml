      update:
        type: github
        repo: mikefarah/yq
        asset: "^yq_man_page_only\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "mv yq-{version} {pkg}/yq"
    - "chmod +x {pkg}/yq"
