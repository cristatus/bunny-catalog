      size: 15499424
      update:
        type: github
        repo: mikefarah/yq
        asset: "^yq_linux_amd64$"
        tag-pattern: "^v([0-9.]+)$"
    - url: "https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_man_page_only.tar.gz"
      file: "yq-man-{version}.tar.gz"
      sha256: "23f2af15723d51db671a647f17dc386678d9ca85bc314025db466b102d47c1f3"
