id: yq
name: yq
description: Portable command-line YAML, JSON, XML, CSV, TOML, and properties processor
version: "4.53.6"
kind: cli
tags: [cli]
homepage: https://mikefarah.gitbook.io/yq/
license: MIT
sources:
    - url: "https://github.com/mikefarah/yq/releases/download/v{version}/yq_linux_amd64"
      file: "yq-{version}"
      sha256: "c5f056448f973ae7d39b5401949648a78f2dc1947d6a8eb65be60d5c504b9385"
      size: 14180512
      update:
        type: github
        repo: mikefarah/yq
        asset: "^yq_linux_amd64$"
        tag-pattern: "^v([0-9.]+)$"
    - url: "https://github.com/mikefarah/yq/releases/download/v{version}/yq_man_page_only.tar.gz"
      file: "yq-man-{version}.tar.gz"
      sha256: "7673c30043f540d1e2cfa825d29e477688147207708e46762b0dd828e842edf4"
      size: 48709
      update:
        type: github
        repo: mikefarah/yq
        asset: "^yq_man_page_only\\.tar\\.gz$"
        tag-pattern: "^v([0-9.]+)$"
prepare:
    - "mv yq-{version} {pkg}/yq"
    - "chmod +x {pkg}/yq"
    - "tar xf yq-man-{version}.tar.gz -C {pkg} yq.1"
bin:
    - {name: yq, path: "{app}/yq"}
man:
    - "{app}/yq.1"
