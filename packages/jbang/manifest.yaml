id: jbang
name: JBang
description: Run Java (and JVM) source files as scripts — no build setup
version: "0.143.0"
kind: sdk
tags: [java, scripting]
homepage: https://www.jbang.dev/
license: MIT
requires: [jdk]
sources:
    - url: "https://github.com/jbangdev/jbang/releases/download/v0.143.0/jbang-0.143.0.zip"
      file: "jbang-{version}.zip"
      sha256: "301c5ef16a7b2a4725515477b03f11f491501eb6db57adfa59393433d4d8f3b2"
      update:
        type: github
        repo: jbangdev/jbang
        asset: "jbang-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q jbang-{version}.zip"
    - "mv jbang-{version}/* {pkg}/"
bin:
    - {name: jbang, path: "{app}/bin/jbang"}
