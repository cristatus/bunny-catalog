id: jbang
name: JBang
description: Run Java (and JVM) source files as scripts — no build setup
version: "0.142.0"
kind: sdk
tags: [java, scripting]
homepage: https://www.jbang.dev/
license: MIT
requires: [jdk]
sources:
    - url: "https://github.com/jbangdev/jbang/releases/download/v0.142.0/jbang-0.142.0.zip"
      file: "jbang-{version}.zip"
      sha256: "8bee0bd035344cc46322aff7117ec475d48cefe37f2a79ff2c6ee3db577bb070"
      update:
        type: github
        repo: jbangdev/jbang
        asset: "jbang-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q jbang-{version}.zip"
    - "mv jbang-{version}/* {pkg}/"
bin:
    - {name: jbang, path: "{app}/bin/jbang"}
