id: gh
name: GitHub CLI
description: GitHub's official command-line tool for repos, PRs, issues, and more
version: "2.101.0"
kind: cli
tags: [cli]
homepage: https://github.com/cli/cli
license: MIT
sources:
    - url: "https://github.com/cli/cli/releases/download/v2.101.0/gh_2.101.0_linux_amd64.tar.gz"
      file: "gh-{version}.tar.gz"
      sha256: "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8"
      size: 15282175
      update:
        type: github
        repo: cli/cli
        asset: "gh_.*_linux_amd64\\.tar\\.gz$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "tar xf gh-{version}.tar.gz --strip-components=1 -C {pkg}"
    # gh's tarball no longer ships pre-built completion files (only a man
    # page describing `gh completion`); generate them from the binary itself.
    - "mkdir -p {pkg}/completions"
    - "{pkg}/bin/gh completion -s bash > {pkg}/completions/gh"
    - "{pkg}/bin/gh completion -s zsh  > {pkg}/completions/_gh"
    - "{pkg}/bin/gh completion -s fish > {pkg}/completions/gh.fish"
bin:
    - {name: gh, path: "{app}/bin/gh"}
env:
    # gh only nags about new releases, it never rewrites its own binary, but
    # bunny already owns that decision.
    GH_NO_UPDATE_NOTIFIER: "1"
completions:
    bash: "{app}/completions/gh"
    zsh: "{app}/completions/_gh"
    fish: "{app}/completions/gh.fish"
man:
    - "{app}/share/man/man1"
