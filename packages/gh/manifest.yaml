id: gh
name: GitHub CLI
description: GitHub's official command-line tool for repos, PRs, issues, and more
version: "2.98.0"
kind: cli
tags: [cli]
homepage: https://github.com/cli/cli
license: MIT
sources:
    - url: "https://github.com/cli/cli/releases/download/v{version}/gh_{version}_linux_amd64.tar.gz"
      file: "gh-{version}.tar.gz"
      sha256: "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de"
      size: 14863663
      update:
        type: github
        repo: cli/cli
        asset: "gh_.*_linux_amd64\\.tar\\.gz$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "tar xf gh-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: gh, path: "{app}/bin/gh"}
completions:
    bash: "{app}/share/bash-completion/completions/gh"
    zsh: "{app}/share/zsh/site-functions/_gh"
    fish: "{app}/share/fish/vendor_completions.d/gh.fish"
