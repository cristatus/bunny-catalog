id: visualvm
name: VisualVM
description: All-in-one Java troubleshooting tool — monitoring, profiling, heap dumps
version: "2.2.2"
kind: app
tags: [java, profiler]
homepage: https://visualvm.github.io/
license: GPL-2.0-with-classpath-exception
requires: [jdk]
sources:
    - url: "https://github.com/oracle/visualvm/releases/download/2.2.2/visualvm_222.zip"
      file: "visualvm-{version}.zip"
      sha256: "5c234f3b241b9d6c33ed4223f86fbf53604da19253884d6eaec28f8b50d1e0b1"
      size: 23248353
      update:
        type: github
        repo: oracle/visualvm
        asset: "visualvm_[0-9]+\\.zip$"
        tag-pattern: "([0-9.]+)"
    # Linux icon: upstream zip ships only a macOS .icns, so vendor an SVG from
    # the Papirus icon theme (LGPL-3.0). Pinned by sha256 so installs don't
    # depend on Papirus' raw URL staying stable.
    - url: "https://github.com/PapirusDevelopmentTeam/papirus-icon-theme/raw/master/Papirus/64x64/apps/visualvm.svg"
      file: "visualvm.svg"
      sha256: "d95619a69aecd2d358a4e87b4b85ce8b1e25fbc9876e8cd2db89b16b2cfb1fe7"
      size: 3225
prepare:
    - "unzip -q visualvm-{version}.zip"
    - "mv visualvm_*/* {pkg}/"
    - "cp visualvm.svg {pkg}/visualvm.svg"
bin:
    - name: visualvm
      path: "{app}/bin/visualvm"
icons:
    - {src: "{app}/visualvm.svg", name: "visualvm", size: "scalable"}
desktop:
    - id: visualvm.desktop
      name: VisualVM
      genericName: Java Profiler
      comment: All-in-one Java troubleshooting tool
      exec: "visualvm"
      icon: visualvm
      type: Application
      categories: [Development, Profiling, Java]
      keywords: [visualvm, java, profiler, monitoring]
