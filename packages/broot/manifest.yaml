id: broot
name: broot
description: Interactive tree view, fuzzy search, and file navigator
version: "1.61.0"
kind: cli
tags: [cli]
homepage: https://dystroy.org/broot/
license: MIT
sources:
    - url: "https://github.com/Canop/broot/releases/download/v1.61.0/broot_1.61.0.zip"
      sha256: "6cafe8e993fb8e5684eb25549703a4fb9dec61ac6a8f1947cbed6566cb4e58e5"
      size: 67984014
      update:
        type: github
        repo: Canop/broot
        asset: "^broot_.*\\.zip$"
prepare:
    - "unzip -q broot_{version}.zip x86_64-unknown-linux-musl/broot -d {pkg}"
    - "mv {pkg}/x86_64-unknown-linux-musl/broot {pkg}/broot"
    - "rmdir {pkg}/x86_64-unknown-linux-musl"
    - "chmod +x {pkg}/broot"
    - "unzip -q broot_{version}.zip completion/broot.bash completion/_broot completion/broot.fish -d {pkg}"
    - "unzip -q broot_{version}.zip broot.1 -d {pkg}"
bin:
    - {name: broot, path: "{app}/broot"}
completions:
    bash: "{app}/completion/broot.bash"
    zsh: "{app}/completion/_broot"
    fish: "{app}/completion/broot.fish"
man:
    - "{app}/broot.1"
