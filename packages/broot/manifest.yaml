id: broot
name: broot
description: Interactive tree view, fuzzy search, and file navigator
version: "1.59.0"
kind: cli
tags: [cli]
homepage: https://dystroy.org/broot/
license: MIT
sources:
    - url: "https://github.com/Canop/broot/releases/download/v{version}/broot_{version}.zip"
      sha256: "f89462cc883d79b548e207a4b2ec34b3736604d0cc54c86f59be5b4f1570a2fd"
      size: 58567571
      update:
        type: github
        repo: Canop/broot
        asset: "^broot_.*\\.zip$"
prepare:
    - "unzip -q broot_{version}.zip x86_64-unknown-linux-musl/broot -d {pkg}"
    - "mv {pkg}/x86_64-unknown-linux-musl/broot {pkg}/broot"
    - "rmdir {pkg}/x86_64-unknown-linux-musl"
    - "chmod +x {pkg}/broot"
bin:
    - {name: broot, path: "{app}/broot"}
