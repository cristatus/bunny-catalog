id: flyway
name: Flyway
description: Database schema versioning and migration tool
version: "13.12.2"
kind: sdk
tags: [database, java]
homepage: https://flywaydb.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/flyway/flyway/releases/download/flyway-13.12.2/flyway-commandline-13.12.2.tar.gz"
      file: "flyway-{version}.tar.gz"
      sha256: "fb96b2e68f9a057564d196afb4d8f35b4869e735df5b8f6ec7bb1c8e7e2298ad"
      size: 322498614
      update:
        type: github
        repo: flyway/flyway
        asset: "^flyway-commandline-[0-9.]+\\.tar\\.gz$"
        tag-pattern: "^flyway-([0-9.]+)$"
prepare:
    - "tar xf flyway-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: flyway, path: "{app}/flyway"}
