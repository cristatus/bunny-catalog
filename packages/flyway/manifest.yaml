id: flyway
name: Flyway
description: Database schema versioning and migration tool
version: "13.10.3"
kind: sdk
tags: [database, java]
homepage: https://flywaydb.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/flyway/flyway/releases/download/flyway-13.10.3/flyway-commandline-13.10.3.tar.gz"
      file: "flyway-{version}.tar.gz"
      sha256: "ba7c2f477b2e906526754e5479f59bce7ab999a524a4912bc5e930701774a201"
      size: 323847263
      update:
        type: github
        repo: flyway/flyway
        asset: "^flyway-commandline-[0-9.]+\\.tar\\.gz$"
        tag-pattern: "^flyway-([0-9.]+)$"
prepare:
    - "tar xf flyway-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: flyway, path: "{app}/flyway"}
