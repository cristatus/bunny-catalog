id: flyway
name: Flyway
description: Database schema versioning and migration tool
version: "13.8.0"
kind: sdk
tags: [database, java]
homepage: https://flywaydb.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/flyway/flyway/releases/download/flyway-13.8.0/flyway-commandline-13.8.0.tar.gz"
      file: "flyway-{version}.tar.gz"
      sha256: "f773e5369c3e9c040e117835bc6f0cc310733195b58ab605f03acb3a415bbfa8"
      size: 323771562
      update:
        type: github
        repo: flyway/flyway
        asset: "^flyway-commandline-[0-9.]+\\.tar\\.gz$"
        tag-pattern: "^flyway-([0-9.]+)$"
prepare:
    - "tar xf flyway-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: flyway, path: "{app}/flyway"}
