id: flyway
name: Flyway
description: Database schema versioning and migration tool
version: "13.12.1"
kind: sdk
tags: [database, java]
homepage: https://flywaydb.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/flyway/flyway/releases/download/flyway-13.12.1/flyway-commandline-13.12.1.tar.gz"
      file: "flyway-{version}.tar.gz"
      sha256: "7ddf854e3d51270965fc6c8ce6dbae11a7d07f884d5af35a71bc12ff18c5b504"
      size: 322379394
      update:
        type: github
        repo: flyway/flyway
        asset: "^flyway-commandline-[0-9.]+\\.tar\\.gz$"
        tag-pattern: "^flyway-([0-9.]+)$"
prepare:
    - "tar xf flyway-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: flyway, path: "{app}/flyway"}
