id: flyway
name: Flyway
description: Database schema versioning and migration tool
version: "13.8.1"
kind: sdk
tags: [database, java]
homepage: https://flywaydb.org/
license: Apache-2.0
requires: [jdk]
sources:
    - url: "https://github.com/flyway/flyway/releases/download/flyway-13.8.1/flyway-commandline-13.8.1.tar.gz"
      file: "flyway-{version}.tar.gz"
      sha256: "5a3f053a5fa8cb75abcfb5d80f649a1a03fb910f6cf77bcc2dfbc477339c3ad3"
      size: 323771918
      update:
        type: github
        repo: flyway/flyway
        asset: "^flyway-commandline-[0-9.]+\\.tar\\.gz$"
        tag-pattern: "^flyway-([0-9.]+)$"
prepare:
    - "tar xf flyway-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: flyway, path: "{app}/flyway"}
