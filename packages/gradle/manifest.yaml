id: gradle
name: Gradle
description: Build automation tool with Groovy/Kotlin DSL for Java, Android, and more
version: "9.8.0"
kind: sdk
tags: [build-tool, java]
homepage: https://gradle.org/
license: Apache-2.0
requires: ["jdk>=17"]
toolchains: gradle
sources:
    - url: "https://services.gradle.org/distributions/gradle-9.8.0-bin.zip"
      file: "gradle-{version}.zip"
      sha256: "bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c"
      size: 151611662
      update:
        type: json
        url: "https://services.gradle.org/versions/current"
        version-query: "version"
        url-query: "downloadUrl"
        hash-query: "checksum"
prepare:
    - "unzip -q gradle-{version}.zip"
    - "mv gradle-{version}/* {pkg}/"
bin:
    - {name: gradle, path: "{app}/bin/gradle"}
