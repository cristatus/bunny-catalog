id: micronaut
name: Micronaut CLI
description: The `mn` command-line tool for creating Micronaut applications
version: "5.2.7"
kind: sdk
tags: [framework, java]
homepage: https://micronaut.io/
license: Apache-2.0
requires: ["jdk>=25"]
sources:
    - url: "https://github.com/micronaut-projects/micronaut-starter/releases/download/v5.2.7/micronaut-cli-5.2.7.zip"
      file: "micronaut-cli-{version}.zip"
      sha256: "b15dfff792e74f18fd55a4ca9ada5085eb16e82c7ca1597185e62a53ef4e250e"
      update:
        type: github
        repo: micronaut-projects/micronaut-starter
        asset: "micronaut-cli-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q micronaut-cli-{version}.zip"
    - "mv micronaut-cli-{version}/* {pkg}/"
bin:
    - {name: mn, path: "{app}/bin/mn"}
