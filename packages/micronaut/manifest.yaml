id: micronaut
name: Micronaut CLI
description: The `mn` command-line tool for creating Micronaut applications
version: "5.2.6"
kind: sdk
tags: [framework, java]
homepage: https://micronaut.io/
license: Apache-2.0
requires: ["jdk>=25"]
sources:
    - url: "https://github.com/micronaut-projects/micronaut-starter/releases/download/v5.2.6/micronaut-cli-5.2.6.zip"
      file: "micronaut-cli-{version}.zip"
      sha256: "ce3a46b649dbf6708e1c41fdea2f9c9f5291d45c9d6c7196ed22b0a033970e4e"
      update:
        type: github
        repo: micronaut-projects/micronaut-starter
        asset: "micronaut-cli-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q micronaut-cli-{version}.zip"
    - "mv micronaut-cli-{version}/* {pkg}/"
bin:
    - {name: mn, path: "{app}/bin/mn"}
