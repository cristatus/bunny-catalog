id: micronaut
name: Micronaut CLI
description: The `mn` command-line tool for creating Micronaut applications
version: "5.1.1"
kind: sdk
tags: [framework, java]
homepage: https://micronaut.io/
license: Apache-2.0
requires: ["jdk>=25"]
sources:
    - url: "https://github.com/micronaut-projects/micronaut-starter/releases/download/v{version}/micronaut-cli-{version}.zip"
      file: "micronaut-cli-{version}.zip"
      sha256: "7af7b2cd151afd840831fcc6d8ecfe34245d0c0c7e5103523e202e20c1d01f7b"
      update:
        type: github
        repo: micronaut-projects/micronaut-starter
        asset: "micronaut-cli-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q micronaut-cli-{version}.zip"
    - "mv micronaut-cli-{version}/* {pkg}/"
bin:
    - {name: mn, path: "{app}/bin/mn"}
