id: micronaut
name: Micronaut CLI
description: The `mn` command-line tool for creating Micronaut applications
version: "5.2.1"
kind: sdk
tags: [framework, java]
homepage: https://micronaut.io/
license: Apache-2.0
requires: ["jdk>=25"]
sources:
    - url: "https://github.com/micronaut-projects/micronaut-starter/releases/download/v5.2.1/micronaut-cli-5.2.1.zip"
      file: "micronaut-cli-{version}.zip"
      sha256: "082fbb8061cca91466bc9c90ccaa46c7d9f5ddaa38b1f0587a89c256b1775aee"
      update:
        type: github
        repo: micronaut-projects/micronaut-starter
        asset: "micronaut-cli-[0-9.]+\\.zip$"
        tag-pattern: "v([0-9.]+)"
prepare:
    - "unzip -q micronaut-cli-{version}.zip"
    - "mv micronaut-cli-{version}/* {pkg}/"
bin:
    - {name: mn, path: "{app}/bin/mn"}
