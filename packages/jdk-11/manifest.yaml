id: jdk-11
name: Eclipse Temurin JDK 11
description: Production-ready OpenJDK 11 LTS distribution from Adoptium
version: "11.0.32.1+1"
kind: sdk
tags: [java, jdk]
homepage: https://adoptium.net/
license: GPL-2.0-with-classpath-exception
provides: jdk
sources:
    - url: "https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.32.1%2B1/OpenJDK11U-jdk_x64_linux_hotspot_11.0.32.1_1.tar.gz"
      file: "temurin-jdk-{version}.tar.gz"
      sha256: "5c3f68887c325d36d852ba534303e1f5f1f5cae7d6cc1e951d73e0d8e98a058d"
      size: 195609919
      update:
        type: foojay
        distribution: temurin
prepare:
    - "tar xf temurin-jdk-{version}.tar.gz --strip-components=1 -C {pkg}"
bin:
    - {name: java, path: "{app}/bin/java"}
    - {name: javac, path: "{app}/bin/javac"}
    - {name: jar, path: "{app}/bin/jar"}
    - {name: javadoc, path: "{app}/bin/javadoc"}
    - {name: jshell, path: "{app}/bin/jshell"}
    - {name: jlink, path: "{app}/bin/jlink"}
    - {name: jdeps, path: "{app}/bin/jdeps"}
    - {name: keytool, path: "{app}/bin/keytool"}
env:
    JAVA_HOME: "{app}"
