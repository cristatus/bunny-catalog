id: zellij
name: zellij
description: Terminal workspace and multiplexer with batteries included
version: "0.45.1"
kind: cli
tags: [cli]
homepage: https://zellij.dev/
license: MIT
sources:
    - url: "https://github.com/zellij-org/zellij/releases/download/v0.45.1/zellij-x86_64-unknown-linux-musl.tar.gz"
      sha256: "40bcc2e03f5d5ae8e054e39f676081fe12ab70871506996ba595834c3718eefc"
      size: 18729165
      update:
        type: github
        repo: zellij-org/zellij
        asset: "^zellij-x86_64-unknown-linux-musl\\.tar\\.gz$"
prepare:
    - "tar xf zellij-x86_64-unknown-linux-musl.tar.gz -C {pkg}"
    # zellij ships no completion files; generate them from the binary itself.
    - "mkdir -p {pkg}/completions"
    - "{pkg}/zellij setup --generate-completion bash > {pkg}/completions/zellij.bash"
    - "{pkg}/zellij setup --generate-completion zsh  > {pkg}/completions/_zellij"
    - "{pkg}/zellij setup --generate-completion fish > {pkg}/completions/zellij.fish"
bin:
    - {name: zellij, path: "{app}/zellij"}
completions:
    bash: "{app}/completions/zellij.bash"
    zsh: "{app}/completions/_zellij"
    fish: "{app}/completions/zellij.fish"
