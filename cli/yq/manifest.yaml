id: yq
name: yq
description: Portable command-line YAML, JSON, XML, CSV, TOML, and properties processor
version: "4.53.3"
category: cli
homepage: https://mikefarah.gitbook.io/yq/
license: MIT

sources:
  - url: "https://github.com/mikefarah/yq/releases/download/v{version}/yq_linux_amd64"
    file: "yq-{version}"
    sha256: "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
    size: 13750434
    update:
      type: github
      repo: mikefarah/yq
      asset: "^yq_linux_amd64$"
      tag-pattern: "^v([0-9.]+)$"

prepare:
  - "mv yq-{version} {pkg}/yq"
  - "chmod +x {pkg}/yq"

bin:
  - { name: yq, path: "{app}/yq" }
