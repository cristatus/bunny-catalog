id: tealdeer
name: tealdeer
description: A very fast implementation of tldr in Rust
version: "1.8.1"
category: cli
kind: cli
homepage: https://github.com/tealdeer-rs/tealdeer
license: MIT OR Apache-2.0
sources:
    - url: "https://github.com/tealdeer-rs/tealdeer/releases/download/v{version}/tealdeer-linux-x86_64-musl"
      file: "tealdeer-{version}"
      sha256: "6f2fad4435e0110484d3f25cdc4bf20129dae03238f32d06ebdd00bdc50ae2ed"
      size: 3564384
      update:
        type: github
        repo: tealdeer-rs/tealdeer
        asset: "^tealdeer-linux-x86_64-musl$"
prepare:
    - "mv tealdeer-{version} {pkg}/tldr"
    - "chmod +x {pkg}/tldr"
bin:
    - {name: tldr, path: "{app}/tldr"}
