      file: "lazygit-{version}.tar.gz"
      sha256: "8e033bc78c8e192dee9510e951f6c9e154289b7198d22c924ed1d0a951b0dac1"
      size: 6868239
      update:
        type: github
        repo: jesseduffield/lazygit
        asset: "lazygit_.*_Linux_x86_64\\.tar\\.gz$"
prepare:
    - "tar xf lazygit-{version}.tar.gz -C {pkg} lazygit"
bin:
    - {name: lazygit, path: "{app}/lazygit"}
