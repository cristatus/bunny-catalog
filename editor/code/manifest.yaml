id: code
name: Visual Studio Code
description: Code editor from Microsoft
version: "1.133.0"
category: editor
kind: app
homepage: https://code.visualstudio.com/
license: MIT
sources:
    - url: "https://update.code.visualstudio.com/{version}/linux-x64/stable"
      file: "code-{version}.tar.gz"
      sha256: "2bf1a90d2f008af009eb3c4a7bd0849b9247a0588cd39a404a0b1e691be68161"
      size: 347821409
      update:
        type: json
        url: "https://update.code.visualstudio.com/api/update/linux-x64/stable/latest"
        version-query: productVersion
        url-query: url
        hash-query: sha256hash
prepare:
    - "tar xf code-{version}.tar.gz --strip-components=1 -C {pkg}"
    - "cp {pkg}/resources/app/resources/linux/code.png {pkg}/code.png"
    - "mkdir -p {pkg}/shell-completions/bash {pkg}/shell-completions/zsh"
    - "cp {pkg}/resources/completions/bash/code {pkg}/shell-completions/bash/"
    - "cp {pkg}/resources/completions/zsh/_code {pkg}/shell-completions/zsh/"
bin:
    - name: code
      path: "{app}/bin/code"
icons:
    - {src: "{app}/code.png", name: "code", size: "128x128"}
desktop:
    - id: code.desktop
      name: Visual Studio Code
      genericName: Text Editor
      comment: Code Editing. Redefined.
      exec: "code %F"
      icon: code
      type: Application
      startupWMClass: Code
      categories: [TextEditor, Development, IDE]
      mimeType: [application/x-code-workspace]
      keywords: [vscode, editor]
      actions:
        - {id: new-empty-window, name: "New Empty Window", exec: "code --new-window"}
    - id: code-url-handler.desktop
      name: Visual Studio Code - URL Handler
      genericName: Text Editor
      comment: Code Editing. Redefined.
      exec: "code --open-url %U"
      icon: code
      type: Application
      noDisplay: true
      startupNotify: true
      categories: [Utility, TextEditor, Development, IDE]
      mimeType: [x-scheme-handler/vscode]
      keywords: [vscode]
completions:
    bash: "{app}/shell-completions/bash/code"
    zsh: "{app}/shell-completions/zsh/_code"
